efesa do internacionalismo e da luta de classes","Separação de poderes e proteção das minorias"],"e":"Também usavam propaganda maciça, nacionalismo extremo e violência contra opositores. O nazismo somava a isso um racismo radical."},{"t":7,"y":"1935","q":"As Leis de Nuremberg, aprovadas pelos nazistas...","o":["Tiraram a cidadania dos judeus alemães","Julgaram os criminosos de guerra nazistas","Criaram a Liga das Nações em Genebra","Dividiram a Alemanha em quatro zonas"],"e":"Cuidado com a pegadinha: o Tribunal de Nuremberg (1945–46) é outra coisa. As leis de 1935 foram um passo rumo ao Holocausto."},{"t":7,"q":"Quem foram as vítimas do Holocausto?","o":["Cerca de 6 milhões de judeus e outros grupos","Apenas soldados aliados capturados nas batalhas","Somente opositores políticos comunistas","Cerca de 6 mil pessoas, todas militares"],"e":"Além dos judeus, foram perseguidos e mortos ciganos (roma e sinti), homossexuais, pessoas com deficiência, testemunhas de Jeová e opositores."},{"t":7,"y":"1/9/1939","q":"Qual acontecimento deu início à Segunda Guerra Mundial na Europa?","o":["A invasão alemã da Polônia","O atentado de Sarajevo de 1914","A queda do Muro de Berlim","O ataque a Pearl Harbor"],"e":"França e Inglaterra declararam guerra dois dias depois. Pearl Harbor (1941) trouxe os EUA para o conflito."},{"t":7,"y":"1944–45","q":"Qual foi a participação do Brasil na Segunda Guerra?","o":["Enviou a FEB para lutar na Itália","Lutou ao lado da Alemanha nazista","Ficou neutro até o fim do conflito","Enviou tropas para invadir o Japão"],"e":"Cerca de 25 mil soldados lutaram, com vitórias como Monte Castelo. A contradição: uma ditadura lutando contra o fascismo enfraqueceu o Estado Novo."},{"t":8,"y":"1945","q":"No Conselho de Segurança da ONU, o que dá tanto poder a EUA, Rússia, China, Reino Unido e França?","o":["O direito de veto","O controle da Assembleia Geral","O comando dos exércitos de todos","A posse exclusiva de armas nucleares"],"e":"Um único veto de um membro permanente derruba uma decisão. Por isso o Conselho muitas vezes fica travado."},{"t":8,"y":"10/12/1948","q":"O que a ONU aprovou em 10 de dezembro de 1948?","o":["A Declaração Universal dos Direitos Humanos","A criação do Pacto de Varsóvia e da OTAN","O fim do Tratado de Versalhes e das reparações","A divisão de Berlim entre quatro potências"],"e":"Depois do Holocausto, o mundo afirmou que todos nascem livres e iguais em dignidade e direitos, sem distinção de raça, sexo, religião ou origem."},{"t":8,"y":"1945–46","q":"O Tribunal de Nuremberg...","o":["Julgou líderes nazistas pelos seus crimes","Tirou a cidadania dos judeus em 1935","Criou o Estado de Israel na Palestina britânica","Dividiu a Coreia em Norte e Sul"],"e":"Criou a ideia de “crimes contra a humanidade” e recusou a desculpa de “só cumprir ordens”."},{"t":8,"y":"1948","q":"O Plano Marshall era...","o":["Ajuda dos EUA para reconstruir a Europa","Um plano soviético para ocupar a Europa","Um acordo para dividir a Alemanha em duas","Um projeto da ONU para descolonizar a África"],"e":"Bilhões de dólares para reconstruir a Europa Ocidental e, ao mesmo tempo, impedir o avanço do comunismo."},{"t":9,"q":"Por que a Guerra Fria tem esse nome?","o":["EUA e URSS nunca se enfrentaram diretamente","Os combates ocorreram só em regiões geladas","Nenhum país entrou em guerra no período","Foi uma guerra curta, de poucos meses"],"e":"Houve guerras indiretas, como Coreia e Vietnã, corrida armamentista e corrida espacial. O medo de uma guerra nuclear impedia o choque direto."},{"t":9,"q":"O Muro de Berlim, símbolo da Guerra Fria, foi...","o":["Erguido em 1961 e derrubado em 1989","Erguido em 1945 e derrubado em 1961","Erguido em 1939 e derrubado em 1945","Erguido em 1989 e derrubado em 1991"],"e":"Ele separava Berlim Oriental, socialista, de Berlim Ocidental. Sua queda abriu caminho para a reunificação alemã e o fim da URSS em 1991."},{"t":9,"y":"1962","q":"O momento em que o mundo esteve mais perto de uma guerra nuclear envolveu...","o":["Mísseis soviéticos instalados em Cuba","Uma bomba atômica lançada sobre Berlim","A invasão americana da União Soviética","Tropas chinesas desembarcando no Alasca"],"e":"Na Crise dos Mísseis, a URSS retirou os mísseis de Cuba e os EUA retiraram os seus da Turquia."},{"t":9,"y":"1947","q":"A independência da Índia teve como grande líder...","o":["Gandhi, com resistência não violenta","Mandela, com a guerra no deserto","Ho Chi Minh, com tropas soviéticas e chinesas","Nasser, com o canal de Suez"],"e":"Boicotes, a Marcha do Sal e a desobediência civil enfraqueceram o domínio britânico. Mas a divisão entre Índia e Paquistão foi violenta."},{"t":9,"y":"1975","q":"Angola e Moçambique conquistaram a independência...","o":["Após a Revolução dos Cravos em Portugal","Logo depois da Segunda Guerra, em 1945","Junto com a independência do Brasil, em 1822","Só depois do fim da União Soviética"],"e":"As guerras coloniais desgastaram a ditadura portuguesa, derrubada em 25 de abril de 1974. Em 1975 vieram as independências."},{"t":9,"y":"1955","q":"A Conferência de Bandung reuniu...","o":["Países afro-asiáticos que queriam não se alinhar","Potências europeias para repartir a África","EUA e URSS para encerrar a Guerra Fria","Países da OTAN reunidos para planejar a invasão de Cuba"],"e":"Daí nasceu a ideia de “Terceiro Mundo” e o Movimento dos Não Alinhados: nem EUA, nem URSS."},{"t":10,"q":"O que caracterizava o populismo na política brasileira entre 1945 e 1964?","o":["Líder carismático falando direto às massas","Governo militar sem nenhum apoio popular","Monarquia constitucional com Poder Moderador","Regime de partido único comunista"],"e":"Vargas, JK e Jango buscavam apoio dos trabalhadores urbanos, com nacionalismo e direitos sociais. O termo também é usado de forma crítica."},{"t":10,"y":"1961","q":"Para Jango assumir a presidência depois da renúncia de Jânio Quadros, que solução foi adotada?","o":["O parlamentarismo","A volta da monarquia","A posse de Juscelino","Um golpe militar imediato"],"e":"Ministros militares tentaram impedir a posse, e Brizola liderou a Campanha da Legalidade. O parlamentarismo foi derrubado num plebiscito em 1963."},{"t":10,"y":"1964","q":"Qual potência apoiou o golpe de 1964 e preparou até uma força naval (Operação Brother Sam) caso houvesse resistência?","o":["Os Estados Unidos","A União Soviética","A China de Mao","A Inglaterra"],"e":"No contexto da Guerra Fria, os EUA temiam que o Brasil “virasse uma nova Cuba”. Documentos liberados depois confirmaram o apoio."},{"t":10,"q":"A Operação Condor foi...","o":["Uma cooperação das ditaduras para caçar opositores","Um programa de vacinação em massa na América do Sul","Um acordo comercial entre os países do Mercosul","Um plano americano para reconstruir a Europa"],"e":"Brasil, Argentina, Chile, Uruguai, Paraguai e Bolívia trocavam informações, sequestravam e matavam exilados além das fronteiras."},{"t":10,"y":"11/9/1973","q":"No Chile, o golpe do general Pinochet derrubou qual presidente socialista eleito?","o":["Salvador Allende","Juan Domingo Perón","Fidel Castro","João Goulart"],"e":"Allende morreu no palácio presidencial durante o ataque. A ditadura de Pinochet durou até 1990."},{"t":10,"y":"1977","q":"Na Argentina, mulheres com lenços brancos passaram a marchar toda semana pedindo notícias dos filhos desaparecidos. Quem eram?","o":["Mães da Praça de Maio","Estudantes caras-pintadas","Diretas Já","Mulheres da FEB"],"e":"Organizações de direitos humanos estimam 30 mil desaparecidos na ditadura argentina. As Mães e as Avós da Praça de Maio seguem ativas."},{"t":11,"q":"Comparando a democracia de Atenas com a atual, qual é a grande diferença?","o":["Atenas excluía mulheres e escravizados","Em Atenas o voto feminino era obrigatório","Hoje a democracia é direta, sem representantes","Em Atenas o rei escolhia quem podia votar"],"e":"Atenas tinha democracia direta, mas só para homens adultos, livres e filhos de atenienses. Estrangeiros também ficavam de fora."},{"t":11,"y":"c. 450 a.C.","q":"A Lei das Doze Tábuas foi uma conquista dos plebeus romanos porque...","o":["Pôs as leis por escrito","Criou o cargo de imperador","Libertou os escravizados","Dividiu o império em dois"],"e":"Antes, só os patrícios conheciam as leis e as interpretavam como queriam. Escrevê-las limitava abusos."},{"t":11,"q":"No feudalismo, o servo...","o":["Estava preso à terra e devia obrigações","Era vendido em mercados como escravo","Mudava de feudo sempre que bem entendesse","Era o dono das terras que cultivava"],"e":"Corveia, talha e banalidades eram algumas obrigações. O servo não podia ser vendido, mas também não podia deixar a terra."},{"t":11,"q":"Na Idade Média, qual foi um papel dos sábios muçulmanos em cidades como Bagdá e Córdoba?","o":["Traduziram e preservaram obras gregas","Destruíram as bibliotecas da Antiguidade","Proibiram o estudo da matemática","Expulsaram todos os cristãos da Europa"],"e":"Aristóteles chegou à Europa cristã em boa parte por traduções do árabe. Os algarismos que usamos também vieram por esse caminho."},{"t":11,"y":"séc. XIV","q":"Uma consequência da Peste Negra na Europa foi...","o":["Falta de mão de obra e revoltas camponesas","Um aumento muito rápido da população europeia","O fortalecimento definitivo da servidão","O fim imediato do comércio com o Oriente"],"e":"Com cerca de um terço da população morta, os camponeses passaram a exigir mais. A crise ajudou a desmontar o feudalismo."},{"t":12,"y":"1517","q":"As 95 teses de Martinho Lutero atacavam...","o":["A venda de indulgências","A tradução da Bíblia ao latim","O poder dos reis absolutistas","O comércio com os muçulmanos"],"e":"Para Lutero, a salvação vinha pela fé, não por pagamento. A imprensa espalhou as teses pela Europa em semanas."},{"t":12,"q":"O mercantilismo defendia...","o":["Acumular metais e exportar mais","Deixar o mercado agir sem o Estado","Abolir as colônias e o monopólio","Dividir os lucros com os operários"],"e":"Metalismo, balança comercial favorável e pacto colonial: a colônia só podia comerciar com a metrópole."},{"t":12,"q":"A plantation açucareira do Brasil colonial se baseava em...","o":["Latifúndio, monocultura, escravidão e exportação","Pequenas propriedades familiares e mercado interno","Trabalho assalariado e produção para o consumo local","Cooperativas indígenas e livre comércio com a Ásia"],"e":"Grandes engenhos produziam um só produto para vender na Europa, com trabalho de africanos escravizados."},{"t":12,"y":"1695","q":"Palmares, na Serra da Barriga, foi...","o":["O maior quilombo da colônia","Um engenho dos holandeses em Recife","Uma missão jesuítica do Sul","Uma vila fundada por bandeirantes"],"e":"Resistiu por quase um século. Zumbi foi morto em 20 de novembro de 1695, data do Dia da Consciência Negra."},{"t":12,"y":"1763","q":"Com a mineração, o centro da colônia se deslocou para o Centro-Sul. O que aconteceu com a capital?","o":["Mudou de Salvador para o Rio","Mudou do Rio para Salvador","Foi transferida para Ouro Preto","Foi transferida para São Paulo"],"e":"O Rio era o porto do ouro de Minas. A mudança mostra como a economia redesenhou o mapa do poder."},{"t":13,"y":"1789","q":"Qual dessas ideias está na Declaração dos Direitos do Homem e do Cidadão?","o":["Os homens nascem livres e iguais em direitos","O poder do rei vem de Deus e não tem limites","A nobreza deve manter privilégios de nascimento","Só o clero pode decidir sobre as leis civis"],"e":"Era o fim legal do Antigo Regime. Mas Olympe de Gouges logo denunciou que as mulheres tinham ficado de fora."},{"t":13,"y":"1791–1804","q":"O que tornou a Revolução do Haiti única?","o":["Foi feita por escravizados, que aboliram a escravidão","Foi liderada por fazendeiros que queriam manter escravos","Foi concedida de forma pacífica pelo governo francês","Transformou o Haiti em uma colônia britânica"],"e":"Liderados por Toussaint Louverture e depois Dessalines, criaram a primeira república negra. O medo de um “novo Haiti” assustou as elites escravistas, inclusive no Brasil."},{"t":13,"y":"1848","q":"Marx e Engels, no Manifesto Comunista, explicavam a história pela...","o":["Luta de classes entre burguesia e proletariado","Harmonia natural e eterna entre patrões e empregados","Mão invisível que equilibra o mercado","Vontade divina dos reis sobre os súditos"],"e":"Para eles, os operários deveriam se organizar e tomar o poder. No mesmo ano, revoluções explodiram pela Europa."},{"t":13,"y":"1848","q":"A Primavera dos Povos foi...","o":["Uma onda de revoltas liberais e nacionalistas","As independências na América espanhola","Uma revolução socialista na Rússia czarista","A reunificação dos EUA depois da Guerra Civil"],"e":"Quase todas foram derrotadas, mas abriram caminho para as unificações da Itália e da Alemanha."},{"t":13,"q":"Quem liderou a maioria das independências da América espanhola?","o":["Criollos, como Simón Bolívar","Indígenas, como Túpac Amaru II","Espanhóis nascidos na Europa","Ingleses vindos do Caribe"],"e":"Criollos eram descendentes de espanhóis nascidos na América, ricos mas sem acesso aos cargos altos. Túpac Amaru II liderou uma grande revolta indígena em 1780, derrotada."},{"t":14,"y":"1824","q":"A Constituição de 1824 deu ao imperador um quarto poder. Qual?","o":["Poder Moderador","Poder Popular","Poder Eclesiástico","Poder Regencial"],"e":"Com ele, o imperador podia dissolver a Câmara e nomear senadores, ficando acima dos outros poderes."},{"t":14,"y":"1850","q":"O que determinou a Lei de Terras?","o":["Terras só por compra","Lotes para cada liberto","Terras grátis a imigrantes","Terras para os indígenas"],"e":"Saiu no mesmo ano do fim do tráfico. Garantiu que libertos e imigrantes pobres não virassem proprietários com facilidade."},{"t":14,"q":"Na Primeira República, o voto de cabresto era possível porque havia...","o":["Voto aberto controlado pelos coronéis","Voto secreto em urnas eletrônicas","Voto feminino obrigatório desde 1891","Eleição indireta feita pelo Congresso"],"e": const lose = () => { [330,247].forEach((f,i)=>setTimeout(()=>beep(f,.25,"sawtooth",.05),i*180)); };

/* ---------- wheel ---------- */
function drawWheel(cv, rot){
  const dpr = window.devicePixelRatio||1, w = cv.clientWidth||300;
  if(cv.width !== Math.round(w*dpr)){ cv.width = cv.height = Math.round(w*dpr); }
  const ctx = cv.getContext("2d"), R = cv.width/2, n = SEGS.length, seg = 2*Math.PI/n;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.translate(R,R);
  ctx.beginPath(); ctx.arc(0,0,R-2,0,2*Math.PI); ctx.fillStyle = C("--ink"); ctx.fill();
  for(let i=0;i<n;i++){
    const a0 = rot + i*seg - Math.PI/2, a1 = a0 + seg;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R*0.95,a0,a1); ctx.closePath();
    ctx.fillStyle = C(SEGS[i].c); ctx.fill();
    ctx.strokeStyle = C("--bg"); ctx.lineWidth = R*0.012; ctx.stroke();
    const mid = a0 + seg/2, flip = Math.cos(mid) < 0;
    ctx.save(); ctx.rotate(flip ? mid + Math.PI : mid);
    ctx.fillStyle = (SEGS[i].c==="--slate"||SEGS[i].c==="--rose"||SEGS[i].c==="--sky"||SEGS[i].c==="--violet") ? C("--ink") : C("--dark-ink");
    const big = /^\d+$/.test(SEGS[i].l);
    ctx.font = `800 ${R*(big?0.13:0.075)}px "Bricolage Grotesque", system-ui, sans-serif`;
    ctx.textAlign = flip ? "left" : "right"; ctx.textBaseline = "middle";
    ctx.fillText(SEGS[i].l, flip ? -R*0.88 : R*0.88, 0);
    ctx.restore();
  }
  for(let i=0;i<n;i++){ const a = rot + i*seg - Math.PI/2; ctx.beginPath(); ctx.arc(Math.cos(a)*R*0.975, Math.sin(a)*R*0.975, R*0.018, 0, 2*Math.PI); ctx.fillStyle = C("--sun"); ctx.fill(); }
  ctx.restore();
}
const segAt = r => { const n=SEGS.length, seg=2*Math.PI/n; const x=((-r)%(2*Math.PI)+2*Math.PI)%(2*Math.PI); return Math.floor(x/seg)%n; };

/* ---------- game ---------- */
function renderGame(){
  const B = BANK[S.serie];
  app.innerHTML = `
  <div class="top">
    <h1>Roleta da <span>História</span></h1>
    <span class="tag alt">${S.serie}ª série</span>
    <span class="sp"></span>
    <button class="btn sec small" id="mute">${muted?"Som: desligado":"Som: ligado"}</button>
    <button class="btn sec small" id="menu">Configurar</button>
    <span id="endwrap"><button class="btn sec small" id="end">Encerrar e ver pódio</button></span>
  </div>
  <div class="stage">
    <div class="board" id="board"></div>
    <div class="wheelbox">
      <div class="wheelwrap"><div class="pointer"></div><canvas id="wheel" aria-label="Roleta"></canvas><button class="hub" id="hub">GIRAR</button></div>
      <div class="result" id="result"></div>
      <div class="legend"><span><b>100–400</b> pergunta valendo os pontos</span><span><b>Todos!</b> todas as equipes respondem</span><span><b>Roubo</b> acerte e tire 100 da líder</span><span><b>Bônus</b> +100 de presente</span>${(S.diff||"mix")==="mix"?"<span><b>300, 400 e Roubo</b> trazem pergunta de desafio</span>":""}</div>
    </div>
  </div>`;
  renderBoard(); renderIdle();
  const cv = document.getElementById("wheel");
  requestAnimationFrame(()=>drawWheel(cv, angle));
  document.getElementById("hub").onclick = spin;
  document.getElementById("mute").onclick = e=>{ muted=!muted; e.target.textContent = muted?"Som: desligado":"Som: ligado"; };
  document.getElementById("menu").onclick = ()=>{ setup.serie=S.serie; renderSetup(); };
  document.getElementById("end").onclick = askEnd;
}
function askEnd(){
  const w = document.getElementById("endwrap");
  w.innerHTML = `<span class="confirm">Encerrar o jogo? <button class="btn small" id="yes">Sim, ver pódio</button><button class="btn sec small" id="no">Voltar</button></span>`;
  document.getElementById("yes").onclick = podium;
  document.getElementById("no").onclick = ()=>{ w.innerHTML=`<button class="btn sec small" id="end">Encerrar e ver pódio</button>`; document.getElementById("end").onclick=askEnd; };
}
function renderBoard(){
  const b = document.getElementById("board"); if(!b) return;
  b.innerHTML = S.teams.map((t,i)=>`
    <div class="team ${i===S.turn?"on":""}">
      <div class="nm">${i===S.turn?'<div class="turn">Vez de</div>':""}${esc(t.name)}</div>
      <div class="pts">${t.score}</div>
      <div class="adj"><button data-i="${i}" data-d="-50" aria-label="Tirar 50 de ${esc(t.name)}">−50</button><button data-i="${i}" data-d="50" aria-label="Dar 50 a ${esc(t.name)}">+50</button></div>
    </div>`).join("");
  b.querySelectorAll(".adj button").forEach(x=>x.onclick=()=>{ const t=S.teams[+x.dataset.i]; t.score=Math.max(0,t.score+ +x.dataset.d); save(); renderBoard(); });
}
function renderIdle(){
  const r = document.getElementById("result"); if(!r) return;
  r.innerHTML = `<div class="eyebrow">Vez de</div><div class="big">${esc(S.teams[S.turn].name)}</div><p>Clique em GIRAR ou aperte a barra de espaço.</p>`;
  const h = document.getElementById("hub"); if(h) h.disabled=false;
}
function spin(){
  if(spinning || landed!==null || cur) return;
  audio(); spinning = true;
  document.getElementById("hub").disabled = true;
  document.getElementById("result").innerHTML = `<div class="big" style="color:var(--muted)">Girando...</div>`;
  const n=SEGS.length, seg=2*Math.PI/n, target=Math.floor(Math.random()*n);
  const off=(target+0.15+Math.random()*0.7)*seg;
  let end=-off; while(end < angle + 2*Math.PI*6) end += 2*Math.PI;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const start=angle, dur=reduce?700:4800, t0=performance.now(); let last=segAt(angle);
  const cv=document.getElementById("wheel");
  function frame(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,4);
    angle=start+(end-start)*e; drawWheel(cv,angle);
    const s=segAt(angle); if(s!==last){ tick(); last=s; }
    if(p<1) requestAnimationFrame(frame); else { spinning=false; angle=angle%(2*Math.PI); land(target); }
  }
  requestAnimationFrame(frame);
}
function land(i){
  landed = i;
  const sg = SEGS[i], team = S.teams[S.turn], r = document.getElementById("result");
  const desc = {
    q: `Pergunta valendo <b>${sg.pts}</b> pontos para ${esc(team.name)}.`,
    all: `Todas as equipes respondem ao mesmo tempo! Cada equipe que acertar ganha <b>100</b>.`,
    steal: `Se ${esc(team.name)} acertar, ganha <b>200</b> e tira <b>100</b> da equipe que estiver na liderança.`,
    pass: `Que azar! A vez passa para a próxima equipe.`,
    bonus: `${esc(team.name)} ganha <b>100 pontos</b> de presente!`
  }[sg.t];
  const title = sg.t==="q" ? (sg.pts===400?"Dobro! 400 pontos":`${sg.pts} pontos`) : sg.l;
  r.innerHTML = `<div class="big" style="color:${C(sg.c)}">${esc(title)}</div><p>${desc}</p>
    <button class="btn" id="go">${sg.t==="pass"||sg.t==="bonus"?"Próxima equipe":"Abrir pergunta"}</button>`;
  if(sg.t==="bonus"){ team.score+=sg.pts; save(); renderBoard(); win(); confetti(); }
  else if(sg.t==="pass"){ lose(); }
  else beep(660,.12,"triangle",.07);
  document.getElementById("go").onclick = ()=> (sg.t==="pass"||sg.t==="bonus") ? nextTurn() : openQ(sg);
  document.getElementById("go").focus({preventScroll:true});
}
function nextTurn(){
  stopTimer(); cur=null; landed=null;
  const ov=document.getElementById("ov"); if(ov) ov.remove();
  S.turn=(S.turn+1)%S.teams.length; save(); renderBoard(); renderIdle();
}
function pickQuestion(sg){
  const B = BANK[S.serie], diff = S.diff||"mix";
  const lvl = i => diff==="basic" ? !B.q[i].d : diff==="hard" ? !!B.q[i].d : true;
  const ok = i => S.temas[B.q[i].t-1] && lvl(i);
  let pool = B.q.map((q,i)=>i).filter(i=>ok(i) && !S.used.includes(i));
  let recycled = false;
  if(!pool.length){ S.used = S.used.filter(i=>!ok(i)); pool = B.q.map((q,i)=>i).filter(ok); recycled = true; }
  if(diff==="mix"){ const wantHard = sg.t==="steal" || (sg.pts||0)>=300; const pref = pool.filter(i=>!!B.q[i].d===wantHard); if(pref.length) pool = pref; }
  const qi = pool[Math.floor(Math.random()*pool.length)];
  S.used.push(qi); save();
  return {qi, recycled};
}
function openQ(sg){
  const B = BANK[S.serie];
  const {qi, recycled} = pickQuestion(sg);
  const q = B.q[qi];
  cur = { sg, q, opts: shuffle(q.o.map((txt,j)=>({txt, ok:j===0}))), done:false, left:S.time };
  const team = S.teams[S.turn];
  const who = sg.t==="all" ? "Todas as equipes" : esc(team.name);
  const ov = document.createElement("div"); ov.className="ov"; ov.id="ov";
  ov.innerHTML = `<div class="ovin">
    <div class="qtop">
      <span class="tag" style="background:${C(sg.c)}">${sg.t==="all"?"Todos! +100":sg.t==="steal"?"Roubo · 200":sg.pts+" pontos"}</span>
      ${q.d?`<span class="tag" style="background:var(--rose);color:var(--ink)">Desafio</span>`:""}
      <span class="tag alt">${who}</span>
      <span class="eyebrow">Tema ${pad(q.t)} · ${esc(B.temas[q.t-1])}${q.y?" · "+esc(q.y):""}</span>
      ${S.time?`<span class="clock" id="clock">${S.time}</span>`:""}
    </div>
    ${S.time?`<div class="tbar"><i id="tbar"></i></div>`:""}
    ${recycled?`<p class="hint">As perguntas desses temas acabaram, então elas voltaram para o sorteio.</p>`:""}
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${cur.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o.txt)}</span></button>`).join("")}</div>
    <div id="after"></div>
    <div class="actions" id="acts">${sg.t==="all"?`<button class="btn" id="reveal">Revelar resposta</button>`:`<span class="hint" style="align-self:center">Clique na alternativa que a equipe escolheu.</span>`}</div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  const rv=document.getElementById("reveal"); if(rv) rv.onclick=()=>choose(-1);
  startTimer();
}
function startTimer(){
  stopTimer(); if(!S.time) return;
  const bar=document.getElementById("tbar"), clk=document.getElementById("clock");
  requestAnimationFrame(()=>{ if(bar) bar.style.width="100%"; });
  timerId = setInterval(()=>{
    if(!cur || cur.done){ stopTimer(); return; }
    cur.left--; if(clk){ clk.textContent=Math.max(0,cur.left); clk.classList.toggle("low",cur.left<=5); }
    if(bar) bar.style.width = Math.max(0,cur.left/S.time*100)+"%";
    if(cur.left<=5 && cur.left>0) beep(900,.06,"square",.04);
    if(cur.left<=0){ stopTimer(); beep(220,.5,"sawtooth",.06); if(clk) clk.textContent="Tempo!"; }
  },1000);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function leaderOther(){
  let best=-1, idx=-1;
  S.teams.forEach((t,i)=>{ if(i!==S.turn && t.score>best){ best=t.score; idx=i; } });
  return best>0 ? idx : -1;
}
function choose(k){
  if(!cur || cur.done) return;
  cur.done = true; stopTimer();
  const ov=document.getElementById("ov"), sg=cur.sg, team=S.teams[S.turn];
  const rightK = cur.opts.findIndex(o=>o.ok);
  ov.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(j===rightK) b.classList.add("right"); else if(j===k) b.classList.add("wrong"); else b.classList.add("dim"); });
  const after=document.getElementById("after"), acts=document.getElementById("acts");
  const exp = `<p>${esc(cur.q.e)}</p>`;
  if(sg.t==="all"){
    after.innerHTML = `<div class="fb info"><b>Resposta: ${"ABCD"[rightK]}</b>${exp}</div>
      <div class="picks"><span class="hint">Quem acertou? Toque nas equipes:</span>${S.teams.map((t,i)=>`<button class="pick" data-i="${i}" aria-pressed="false">${esc(t.name)}</button>`).join("")}</div>`;
    after.querySelectorAll(".pick").forEach(p=>p.onclick=()=>p.setAttribute("aria-pressed", p.getAttribute("aria-pressed")!=="true"));
    acts.innerHTML = `<button class="btn" id="give">Dar 100 a quem acertou e seguir</button>`;
    document.getElementById("give").onclick = ()=>{
      let any=false; after.querySelectorAll('.pick[aria-pressed="true"]').forEach(p=>{ S.teams[+p.dataset.i].score+=100; any=true; });
      save(); renderBoard(); if(any){ win(); confetti(); } setTimeout(nextTurn, any?700:0);
    };
    return;
  }
  const ok = k===rightK;
  if(ok){
    let extra="";
    team.score += sg.pts;
    if(sg.t==="steal"){ const li=leaderOther(); if(li>=0){ S.teams[li].score=Math.max(0,S.teams[li].score-100); extra=` e tira 100 de ${esc(S.teams[li].name)}`; } }
    save(); renderBoard(); win(); confetti();
    after.innerHTML = `<div class="fb ok"><b>Acertou! ${esc(team.name)} ganha ${sg.pts}${extra}.</b>${exp}</div>`;
    acts.innerHTML = `<button class="btn" id="nx">Próxima equipe</button>`;
  } else {
    lose();
    const half = Math.round(sg.pts/2/50)*50 || 50;
    after.innerHTML = `<div class="fb no"><b>Não foi dessa vez! A resposta é a ${"ABCD"[rightK]}.</b>${exp}</div>
      <div class="picks" id="reb"><span class="hint">Rebote: outra equipe tinha a resposta certa? Vale ${half}.</span>${S.teams.map((t,i)=>i===S.turn?"":`<button class="pick" data-i="${i}" aria-pressed="false">${esc(t.name)}</button>`).join("")}</div>`;
    after.querySelectorAll("#reb .pick").forEach(p=>p.onclick=()=>{
      S.teams[+p.dataset.i].score += half; save(); renderBoard(); win(); confetti();
      after.querySelectorAll("#reb .pick").forEach(x=>x.disabled=true); p.setAttribute("aria-pressed","true");
    });
    acts.innerHTML = `<button class="btn" id="nx">Próxima equipe</button>`;
  }
  const nx=document.getElementById("nx"); nx.onclick=nextTurn; nx.focus({preventScroll:true});
}

/* ---------- podium ---------- */
function podium(){
  stopTimer(); const ov=document.getElementById("ov"); if(ov) ov.remove();
  const ranked = S.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score);
  app.innerHTML = `<div class="podium">
    <div class="eyebrow">${S.serie}ª série · resultado final</div>
    <h1>${esc(ranked[0].name)} venceu!</h1>
    ${ranked.map((t,i)=>`<div class="rank"><span class="pos">${i+1}º</span><span>${esc(t.name)}</span><span class="pts">${t.score}</span></div>`).join("")}
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="btn sec" id="back">Voltar ao jogo</button>
      <button class="btn" id="new">Novo jogo</button>
    </div>
  </div>`;
  win(); confetti(true);
  document.getElementById("back").onclick = renderGame;
  document.getElementById("new").onclick = ()=>{ clearSaved(); setup.serie=S.serie; S=null; renderSetup(); };
}

/* ---------- confetti ---------- */
function confetti(big){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("confetti"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=["--sun","--coral","--teal","--blue","--violet","--rose"].map(C);
  const ps=Array.from({length:big?220:120},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,s:6+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  const t0=performance.now();
  (function f(t){ const el=t-t0; ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.vy+=.45; p.x+=p.vx; p.y+=p.vy; p.r+=.2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(el<(big?3200:1800)) requestAnimationFrame(f); else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

/* ---------- keys & boot ---------- */
document.addEventListener("keydown", e=>{
  if(!S || !document.getElementById("wheel")) return;
  if(/INPUT|SELECT/.test(e.target.tagName)) return;
  if(e.code==="Space" && !cur && landed===null){ e.preventDefault(); spin(); }
  else if(cur && !cur.done && cur.sg.t!=="all"){ const n="1234".indexOf(e.key); const m="abcd".indexOf(e.key.toLowerCase()); const k=n>=0?n:m; if(k>=0) choose(k); }
});
addEventListener("resize", ()=>{ const w=document.getElementById("wheel"); if(w) drawWheel(w,angle); });
const h = (location.hash||"").match(/serie-([123])/); if(h) setup.serie=+h[1];
document.fonts && document.fonts.ready.then(()=>{ const m=document.getElementById("mini"); if(m) drawWheel(m,0.3); const w=document.getElementById("wheel"); if(w) drawWheel(w,angle); });
renderSetup();
</script>

</html>
