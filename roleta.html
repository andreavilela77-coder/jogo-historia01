<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Roleta da História</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: game-show stage for a projector. Setup screen, then scoreboard column + big wheel; questions open full-screen.
   Single dark look on purpose: reads best on a classroom projector in either host theme. */
:root{
  --bg:#141A3C; --bg2:#1C2350; --panel:#232C61; --ink:#F4F6FF; --muted:#B3BBDE; --line:#3A4482;
  --sun:#F6C744; --coral:#FF7B5C; --teal:#3CC4A8; --blue:#6C8BFF; --violet:#B76CF0; --rose:#E8547A; --slate:#5B6478; --sky:#2E9BD6;
  --ok:#4BD08A; --ok-bg:#163D33; --bad:#FF6B6B; --bad-bg:#47202E; --dark-ink:#141A3C;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;
  background:radial-gradient(1200px 600px at 60% 40%, var(--bg2), var(--bg)) fixed}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:12px 24px;font-weight:700;background:var(--sun);color:var(--dark-ink);font-size:1.05rem}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:32px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px;position:sticky;top:18px}
.hero h1{font-size:clamp(2.6rem,6vw,4.6rem);font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--sun)}
.hero p{color:var(--muted);margin:0;max-width:52ch}
.mini{width:min(360px,100%);aspect-ratio:1;max-width:100%}
.form{display:flex;flex-direction:column;gap:22px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0}
.form h2{font-size:1.2rem}
.series{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.serie{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.serie b{font-family:var(--display);font-size:1.5rem}
.serie span{font-size:.85rem;color:var(--muted)}
.serie[aria-pressed="true"]{border-color:var(--sun);background:#2C2A3E}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;text-align:left}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--dark-ink);border-color:var(--sun);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.teams input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.saved{background:var(--ok-bg);border:1px solid var(--ok);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.saved p{margin:0;flex:1;min-width:200px}
.hint{color:var(--muted);font-size:.88rem;margin:0}

/* game */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:1.6rem;font-weight:800}
.top h1 span{color:var(--sun)}
.top .sp{flex:1}
.stage{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:24px;align-items:start}
.board{display:flex;flex-direction:column;gap:8px}
.team{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;transition:transform .2s,border-color .2s}
.team.on{border-color:var(--sun);transform:scale(1.03);box-shadow:0 0 0 4px rgba(246,199,68,.18)}
.team .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.team .pts{font-family:var(--display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;grid-row:span 2}
.team .adj{display:flex;gap:4px}
.team .adj button{background:none;border:1px solid var(--line);border-radius:6px;font-size:.75rem;padding:1px 6px;color:var(--muted)}
.turn{font-size:.78rem;color:var(--sun);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.wheelbox{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.wheelwrap{position:relative;width:min(64vh,100%);max-width:640px;aspect-ratio:1}
.wheelwrap canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:42px solid var(--ink);filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:24%;height:24%;border-radius:50%;background:var(--bg);border:5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(.9rem,2.2vw,1.5rem);color:var(--sun);cursor:pointer;z-index:2}
.hub:disabled{cursor:default;color:var(--muted)}
.result{min-height:120px;width:100%;max-width:640px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .big{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4vw,2.8rem)}
.result p{margin:0;color:var(--muted);font-size:1.1rem;max-width:46ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.85rem;color:var(--muted);max-width:640px}
.legend b{color:var(--ink)}

/* question overlay */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovin{max-width:1150px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.qtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tag{background:var(--sun);color:var(--dark-ink);border-radius:999px;padding:5px 14px;font-weight:800;font-family:var(--display)}
.tag.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-family:var(--body);font-weight:700}
.clock{margin-left:auto;font-family:var(--display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.clock.low{color:var(--bad)}
.tbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sun);width:100%;transition:width 1s linear}
.q{font-size:clamp(1.4rem,2.7vw,2.3rem);font-weight:700;line-height:1.3;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;display:flex;gap:14px;align-items:center;font-size:clamp(1.05rem,1.9vw,1.55rem);min-width:0}
.opt:hover:not(:disabled){border-color:var(--sun)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:2.1em;height:2.1em;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--dark-ink)}
.opt:nth-child(1) .k{background:var(--sun)} .opt:nth-child(2) .k{background:var(--coral)}
.opt:nth-child(3) .k{background:var(--teal)} .opt:nth-child(4) .k{background:var(--blue)}
.opt span:last-child{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.4}
.fb{border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:6px;font-size:1.15rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)} .fb.no{background:var(--bad-bg);border:1px solid var(--bad)} .fb.info{background:var(--panel);border:1px solid var(--line)}
.fb b{font-family:var(--display);font-size:1.5rem}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}
.fb p{margin:0}
.picks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700}
.pick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--dark-ink)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* podium */
.podium{max-width:760px;margin:20px auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.podium h1{font-size:clamp(2.4rem,6vw,4rem);color:var(--sun)}
.rank{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 20px;text-align:left;font-size:1.3rem}
.rank:first-of-type{border-color:var(--sun)}
.rank .pos{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--sun)}
.rank .pts{font-family:var(--display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.confirm{display:inline-flex;gap:8px;align-items:center;background:var(--bad-bg);border:1px solid var(--bad);border-radius:999px;padding:4px 6px 4px 14px;font-size:.9rem}

@media (max-width:860px){ .setup,.stage{grid-template-columns:1fr} .hero{position:static} .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))} .opts{grid-template-columns:1fr} }
@media (max-width:460px){ .series{grid-template-columns:1fr} body{font-size:16px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="wrap" id="app"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
const BANK = {"1":{"temas":["Ocupação e administração da América portuguesa","Do açúcar ao ouro","Tráfico, escravidão e resistência","Do absolutismo ao Estado liberal","Dos cercamentos à fábrica","Fontes, memória e primeiros habitantes","Grécia Antiga","Roma Antiga","Idade Média: Europa, Bizâncio, Islã e África","Renascimento, Reformas e Estados modernos","Povos originários, navegações e conquista","Da Proclamação ao Estado Novo","De 1945 ao golpe de 1964","Redemocratização e Brasil contemporâneo"],"q":[{"t":1,"y":"1534","q":"A Coroa portuguesa dividiu o território em grandes faixas e entregou cada uma a um particular, que devia povoar e defender a terra com recursos próprios. Que sistema era esse?","o":["Capitanias hereditárias","Governo-Geral centralizado","Vice-reinado do Prata","Sistema de sesmarias reais"],"e":"Os donatários recebiam a capitania e bancavam tudo do próprio bolso. Faltou dinheiro e sobrou ataque: só Pernambuco e São Vicente prosperaram de verdade."},{"t":1,"y":"1549","q":"Tomé de Sousa desembarca, funda Salvador e vira o primeiro governador-geral. Qual era a missão do Governo-Geral?","o":["Centralizar a administração colonial","Extinguir as capitanias de imediato","Libertar os indígenas escravizados nas vilas","Preparar a autonomia da colônia"],"e":"As capitanias não davam conta sozinhas. O Governo-Geral não acabou com elas: colocou um poder central por cima, com ouvidor, provedor e capitão-mor. Junto com Tomé de Sousa vieram os primeiros jesuítas."},{"t":1,"y":"1750","q":"No Tratado de Madri, Portugal e Espanha adotaram o princípio do uti possidetis. Traduzindo para o português do dia a dia:","o":["Fica com a terra quem a ocupa","A linha de Tordesilhas é eterna","O papa decide as fronteiras","Terra indígena não se ocupa"],"e":"Bandeirantes, missões e criadores de gado já tinham passado muito da linha de Tordesilhas. Com o uti possidetis, essa ocupação virou fronteira oficial, e o mapa do Brasil ficou parecido com o atual."},{"t":1,"q":"Nas câmaras municipais da colônia, quem podia votar e ser eleito eram os chamados “homens bons”. Quem eram eles?","o":["Proprietários ricos de “sangue limpo”","Todos os moradores livres da vila","Padres jesuítas indicados pelo bispo","Comerciantes estrangeiros naturalizados"],"e":"“Bom” aqui não tinha nada a ver com bondade: era quem tinha posses e prestígio. Artesãos, pobres, mulheres, indígenas e escravizados ficavam de fora."},{"t":2,"q":"No engenho de açúcar, a casa-grande e a senzala ficavam lado a lado. O que essa dupla mostra sobre aquela sociedade?","o":["Hierarquia entre senhores e escravizados","Igualdade entre todos que trabalhavam","Administração do engenho pela Igreja","Controle da produção pelos comerciantes holandeses"],"e":"Casa-grande era a moradia do senhor e da família; senzala, o alojamento dos escravizados. A arquitetura do engenho desenhava a desigualdade no chão."},{"t":2,"y":"séc. XVIII","q":"A Coroa cobrava 20% de todo o ouro extraído nas Minas. Como se chamava esse imposto?","o":["Quinto","Derrama","Dízimo","Talha"],"e":"Quinto = 1/5 = 20%. A derrama era outra coisa: a cobrança forçada dos atrasados, casa por casa, quando a meta de ouro não era atingida. Foi o estopim da Inconfidência Mineira."},{"t":2,"y":"1703","q":"Pelo Tratado de Methuen, Portugal vendia vinho à Inglaterra e comprava tecidos ingleses. Qual foi o efeito sobre o ouro brasileiro?","o":["Foi para a Inglaterra pagar o déficit","Ficou em Lisboa financiando fábricas","Pagou a Holanda pela saída do Nordeste","Ficou no Brasil e financiou a independência"],"e":"Tecido valia mais que vinho, então Portugal fechava a conta no vermelho e pagava em ouro. Muita gente diz que o ouro de Minas ajudou a financiar a Revolução Industrial inglesa."},{"t":2,"y":"1707–09","q":"Paulistas que descobriram ouro versus “forasteiros” portugueses e de outras capitanias que chegaram depois. Que conflito foi esse?","o":["Guerra dos Emboabas","Guerra dos Mascates","Revolta de Beckman","Confederação dos Tamoios"],"e":"“Emboaba” era o apelido que os paulistas davam aos forasteiros. Os paulistas perderam, e a Coroa aproveitou para controlar melhor a região das Minas."},{"t":3,"q":"No comércio triangular, no trecho África → América, o que os navios negreiros transportavam?","o":["Africanos escravizados","Açúcar e tabaco brasileiros","Armas e tecidos europeus","Ouro e prata americanos"],"e":"Europa mandava manufaturas e armas para a África; da África saíam cativos para a América; da América voltavam açúcar, tabaco e metais. Cerca de 12,5 milhões de pessoas foram embarcadas, e quase 4,8 milhões vieram para o Brasil."},{"t":3,"y":"20/11/1695","q":"Por que o Dia da Consciência Negra é celebrado em 20 de novembro?","o":["É a data da morte de Zumbi","É o dia da assinatura da Lei Áurea","É o aniversário da Revolta dos Malês","Marca o fim do tráfico atlântico"],"e":"Zumbi liderou Palmares, na Serra da Barriga (atual Alagoas), o maior quilombo da colônia. O movimento negro escolheu a data para lembrar a resistência, e não a “concessão” da Lei Áurea (13 de maio)."},{"t":3,"y":"1850","q":"Qual lei proibiu de vez o tráfico atlântico de africanos para o Brasil?","o":["Lei Eusébio de Queirós","Lei do Ventre Livre","Lei Saraiva-Cotegipe (Sexagenários)","Lei Áurea de 1888"],"e":"Sequência para guardar: 1831 (lei “para inglês ver”), 1850 (Eusébio de Queirós, fim do tráfico), 1871 (Ventre Livre), 1885 (Sexagenários), 1888 (Áurea)."},{"t":3,"y":"1835","q":"Em Salvador, africanos muçulmanos, muitos alfabetizados em árabe, organizaram uma grande revolta. Qual?","o":["Revolta dos Malês","Balaiada","Cabanagem","Revolta da Chibata"],"e":"“Malê” vinha de imale, palavra iorubá para muçulmano. A revolta foi derrotada em poucas horas, mas assustou tanto as elites que a repressão a africanos aumentou no país inteiro."},{"t":4,"q":"“O homem é o lobo do homem.” Para fugir dessa guerra de todos contra todos, as pessoas entregariam o poder a um soberano absoluto, o Leviatã. Quem pensava assim?","o":["Thomas Hobbes","John Locke","Montesquieu","Jean-Jacques Rousseau"],"e":"Hobbes viveu a guerra civil inglesa e concluiu que segurança vinha antes de liberdade. Daí a defesa de um poder forte e indivisível."},{"t":4,"q":"John Locke, inspirador da Revolução Gloriosa, defendia que...","o":["Direitos naturais e direito de resistência","O poder do rei vem diretamente de Deus e é absoluto","O Estado deve controlar toda a economia","A propriedade privada deve ser abolida"],"e":"Para Locke, o governo existe para proteger direitos. Se ele os viola, o povo pode derrubá-lo. Essa é uma das raízes do liberalismo político."},{"t":4,"q":"Montesquieu ficou famoso por propor...","o":["A separação dos três poderes","O direito divino dos reis","A mão invisível do mercado","A vontade geral do contrato social"],"e":"A ideia é que “o poder freie o poder”. A Constituição brasileira de 1988 segue esse modelo."},{"t":4,"y":"1776","q":"Adam Smith usou o exemplo de uma fábrica de alfinetes para mostrar que a produtividade cresce muito com...","o":["Divisão do trabalho","Proteção alfandegária","Volta ao artesanato","Controle real de preços"],"e":"Cada operário fazendo uma etapa produzia muito mais. Smith também falou da “mão invisível”: o mercado se ajustaria com pouca interferência do Estado, ao contrário do mercantilismo."},{"t":4,"y":"1689","q":"Depois da Revolução Gloriosa, a Inglaterra aprovou o Bill of Rights. O que ele fez?","o":["Limitou o rei e fortaleceu o Parlamento","Restaurou o absolutismo dos Stuart","Proclamou a república de Cromwell","Criou o voto universal para homens e mulheres"],"e":"O rei passou a depender do Parlamento para cobrar impostos e manter exército. Nascia a monarquia parlamentar."},{"t":5,"y":"1516","q":"Em Utopia, Thomas More escreveu que na Inglaterra “as ovelhas devoram os homens”. Ele estava criticando...","o":["Camponeses expulsos para criar ovelhas","Ataques de lobos às aldeias e aos rebanhos","A fome causada pela Peste Negra","O fim da criação de animais no campo"],"e":"A lã dava lucro, então os senhores cercaram terras comunais. Os camponeses expulsos foram para as cidades e viraram mão de obra barata das futuras fábricas."},{"t":5,"q":"O historiador E. P. Thompson estudou a “disciplina do tempo” na Revolução Industrial. O que mudou na vida do trabalhador?","o":["O relógio passou a ditar o ritmo do trabalho","Ele passou a trabalhar só quando quisesse","As jornadas ficaram mais curtas logo de cara","O trabalho passou a seguir as estações do ano"],"e":"No campo, o tempo era o da tarefa e da natureza. Na fábrica, sirene, relógio e multa. Jornadas de 14 a 16 horas, inclusive para crianças."},{"t":5,"y":"1811–16","q":"Na Inglaterra, grupos de trabalhadores invadiam fábricas e quebravam máquinas. Quem eram e por que faziam isso?","o":["Luditas, contra desemprego e salários baixos","Cartistas, exigindo o voto para as mulheres inglesas","Jacobinos, defendendo a república na França","Anarquistas, combatendo o poder da Igreja"],"e":"As máquinas tiravam o emprego de artesãos qualificados. Quebrar o tear era uma forma de pressão quando não existiam sindicatos legais."},{"t":5,"q":"Qual dessas mudanças fez parte da Revolução Agrícola inglesa e ajudou a liberar gente para as cidades?","o":["Rotação de culturas e novas técnicas","A volta do sistema feudal de servidão","A proibição da criação de ovelhas","Distribuição de terras a todos os camponeses"],"e":"Com mais comida e menos gente necessária no campo, sobrou mão de obra para as fábricas. Cercamentos e técnicas novas andaram juntos."},{"t":6,"q":"Uma playlist de funk, uma certidão de nascimento e um caco de cerâmica podem ser fontes históricas?","o":["Sim, todo vestígio humano pode ser fonte","Não, só documentos oficiais escritos contam","Só a certidão, porque é documento oficial","Só a cerâmica, porque é bem mais antiga"],"e":"Fontes podem ser escritas, orais, visuais, sonoras ou materiais. O historiador faz perguntas a elas: quem produziu, quando, para quê."},{"t":6,"q":"Arqueólogos usam o carbono-14 para...","o":["Datar restos orgânicos","Revelar cores de pinturas","Decifrar escritas antigas","Descobrir a profissão do morto"],"e":"Todo ser vivo acumula carbono-14, que vai sumindo num ritmo conhecido depois da morte. Medindo o que sobrou, dá para estimar a idade de até uns 50 mil anos."},{"t":6,"q":"Luzia, um dos esqueletos humanos mais antigos das Américas (cerca de 11 mil anos), foi encontrada em...","o":["Lagoa Santa, Minas Gerais","Serra da Capivara, Piauí","Ilha de Marajó, Pará","Vale do Ribeira, São Paulo"],"e":"O crânio estava no Museu Nacional e foi resgatado dos escombros do incêndio de 2018. Na Serra da Capivara, a arqueóloga Niède Guidon estudou pinturas rupestres e defendeu uma ocupação ainda mais antiga."},{"t":6,"q":"Os sambaquis, encontrados no litoral brasileiro, são...","o":["Montes de conchas feitos por povos do litoral","Vasos de cerâmica pintada feitos pelos povos da Amazônia","Desenhos gigantes feitos no chão da floresta","Aldeias jesuítas do litoral no século XVI"],"e":"Alguns têm mais de 30 metros de altura e milhares de anos. Serviam também como cemitério e marco no território."},{"t":6,"q":"Qual a diferença entre história e memória?","o":["Memória é lembrança seletiva; história usa método","São a mesma coisa, só que com nomes diferentes nos livros","História é sempre oral; memória é sempre escrita","Memória é científica; história é só opinião"],"e":"As duas se alimentam. Um monumento, uma festa ou um feriado são memória; o trabalho crítico com fontes é história."},{"t":7,"q":"Uma pólis treinava os meninos para a guerra desde os 7 anos; a outra criou a democracia. Quem é quem?","o":["Esparta militarista; Atenas democrática","Atenas militarista; Esparta democrática","As duas eram democracias de cidadãos","As duas eram impérios governados por reis"],"e":"Esparta tinha dois reis e uma sociedade voltada à guerra. Atenas, com Clístenes (508 a.C.), criou a democracia com a Eclésia, a assembleia dos cidadãos."},{"t":7,"q":"Na democracia ateniense, quem podia votar na Eclésia?","o":["Homens adultos, livres, filhos de atenienses","Todos os moradores de Atenas, sem exceção","Homens e mulheres livres, desde que maiores de idade","Quem pagasse impostos, até estrangeiros"],"e":"Mulheres, estrangeiros (metecos) e escravizados ficavam de fora. Era uma democracia direta, mas para uma minoria."},{"t":7,"q":"O que era o ostracismo em Atenas?","o":["Exílio de 10 anos votado pelos cidadãos","Pena de morte aplicada aos traidores da pólis","Uma competição de poesia e teatro","Assembleia restrita aos mais ricos"],"e":"Os votos eram escritos em cacos de cerâmica, os ostraka. Daí o nome e a expressão “ficar no ostracismo”."},{"t":7,"y":"séc. IV a.C.","q":"As conquistas de Alexandre, o Grande, misturaram a cultura grega com a do Oriente. Esse período se chama...","o":["Helenismo","Iluminismo","Feudalismo","Renascimento"],"e":"Alexandria, no Egito, virou o centro do saber, com sua biblioteca. Lá, Eratóstenes calculou a circunferência da Terra com sombras e geometria."},{"t":8,"q":"Na República romana, os plebeus conquistaram os tribunos da plebe. Qual era o superpoder deles?","o":["Vetar decisões contra os plebeus","Comandar o exército nas guerras","Nomear o imperador de Roma","Escolher os sacerdotes do templo"],"e":"Os tribunos eram “invioláveis” e podiam dizer veto. Outra vitória plebeia foi a Lei das Doze Tábuas: leis escritas, que não dependiam da memória dos patrícios."},{"t":8,"q":"“Pão e circo”: o que essa política fazia em Roma?","o":["Dar trigo e espetáculos aos pobres","Educar jovens em escolas públicas","Taxar ricos para pagar o exército","Proibir jogos para evitar desordem"],"e":"Lutas de gladiadores no Coliseu, corridas no Circo Máximo e trigo barato ajudavam a evitar revoltas urbanas."},{"t":8,"y":"313 → 380","q":"O cristianismo foi perseguido em Roma e depois virou religião oficial. Qual a ordem certa?","o":["Constantino libera (313); Teodósio oficializa (380)","Teodósio libera (313); Constantino oficializa (380)","Nero libera (64); Diocleciano oficializa (303)","Júlio César oficializa (44 a.C.); Nero proíbe (64)"],"e":"Édito de Milão em 313 e Édito de Tessalônica em 380. Em menos de 70 anos, de perseguidos a religião do império."},{"t":8,"y":"476","q":"Em 476, o último imperador romano do Ocidente foi deposto. E a parte oriental do império?","o":["Durou como Império Bizantino até 1453","Foi destruída no mesmo ano de 476","Foi conquistada pelos cartagineses","Tornou-se uma república democrática governada pelo Senado"],"e":"Com capital em Constantinopla, Bizâncio durou quase mil anos a mais, até a conquista otomana."},{"t":8,"y":"73–71 a.C.","q":"Um gladiador escravizado liderou dezenas de milhares de pessoas numa revolta contra Roma. Quem?","o":["Espártaco","Júlio César","Tibério Graco","Aníbal Barca"],"e":"Espártaco virou símbolo de rebeldia contra a escravidão. Aníbal era cartaginês (Guerras Púnicas), e os Gracos eram tribunos que propuseram reforma agrária."},{"t":9,"y":"c. 1030","q":"O bispo Adalberão de Laon dividiu a sociedade medieval em três ordens. Quais?","o":["Os que rezam, guerreiam e trabalham","Senhores, mercadores e artesãos livres","Ricos, remediados e pobres da aldeia","Reis, burgueses e operários urbanos"],"e":"Clero (oratores), nobreza (bellatores) e camponeses (laboratores). A ideia justificava que cada um ficasse no seu lugar."},{"t":9,"q":"O servo era obrigado a trabalhar de graça alguns dias por semana nas terras do senhor. Como se chamava essa obrigação?","o":["Corveia","Talha","Banalidade","Dízimo"],"e":"Talha era entregar parte da colheita; banalidade era pagar para usar o moinho, o forno ou a prensa do senhor; dízimo ia para a Igreja."},{"t":9,"y":"1324","q":"Mansa Musa, imperador do Mali, fez uma peregrinação a Meca e distribuiu tanto ouro no Cairo que...","o":["O preço do ouro despencou por anos","Foi preso por contrabando de metais","Comprou a cidade de Constantinopla","Proibiu o comércio de sal no Saara"],"e":"O Mali controlava rotas de ouro e sal pelo Saara, e Tombuctu era um grande centro de estudos islâmicos. Muita gente considera Mansa Musa uma das pessoas mais ricas da história."},{"t":9,"y":"1347–51","q":"No século XIV, a Peste Negra atingiu a Europa. Estima-se que ela matou...","o":["Cerca de um terço dos europeus","Menos de 1% da população","Apenas os animais domésticos","Só pessoas no Oriente asiático"],"e":"Com tanta gente morta, faltou mão de obra, e camponeses passaram a exigir melhores condições. Foi uma das peças da crise do feudalismo."},{"t":9,"q":"Na África ocidental, os griôs tinham um papel importante. Qual?","o":["Transmitir a história pela tradição oral","Cobrar os impostos em nome do rei","Comandar caravanas pelo deserto","Construir as igrejas talhadas na pedra de Lalibela"],"e":"Os griôs contavam genealogias e feitos dos reis com música e poesia. A Epopeia de Sundiata, fundador do Mali, chegou até nós assim."},{"t":10,"y":"c. 1450","q":"A prensa de tipos móveis de Gutenberg mudou o mundo porque...","o":["Barateou os livros e espalhou ideias","Permitiu imprimir dinheiro de papel","Substituiu os copistas por escravizados","Só imprimia livros proibidos pela Igreja"],"e":"Sem a imprensa, as ideias de Lutero não teriam se espalhado tão depressa. Ela também ajudou o humanismo e a ciência."},{"t":10,"y":"1517","q":"Martinho Lutero publicou as 95 teses criticando principalmente...","o":["A venda de indulgências","A tradução da Bíblia","A arte renascentista","O comércio com o Oriente"],"e":"Indulgências prometiam reduzir a pena dos pecados mediante pagamento. Lutero defendia a salvação pela fé e a leitura da Bíblia por todos."},{"t":10,"y":"1633","q":"Galileu Galilei foi julgado pela Inquisição e obrigado a negar o que defendia. O que era?","o":["Que a Terra gira em torno do Sol","Que a Terra é plana e imóvel","Que a Lua tem luz própria","Que não existem estrelas além das que vemos"],"e":"Galileu apoiou o heliocentrismo de Copérnico, com observações de telescópio. Diz a lenda que, depois de negar, murmurou: “E, no entanto, ela se move”."},{"t":10,"q":"O Concílio de Trento (1545–1563) foi a resposta católica à Reforma. O que ele fez?","o":["Reafirmou dogmas e reforçou a Inquisição","Aceitou as ideias de Martinho Lutero sobre a fé","Acabou com o celibato dos padres","Separou a Igreja católica do papa"],"e":"Isso é a Contrarreforma. Os jesuítas, fundados em 1540, foram peça-chave, inclusive na catequese aqui na América portuguesa."},{"t":10,"q":"Por que muitos historiadores criticam chamar a Idade Média de “Idade das Trevas”?","o":["Houve universidades, catedrais e ciência","Não houve guerras durante todo o período","A Igreja não tinha poder algum na época","O termo foi inventado só no século XX"],"e":"O rótulo foi criado por renascentistas e iluministas que queriam parecer as “luzes”. Universidades como Bolonha e Paris são medievais."},{"t":11,"q":"Tenochtitlán, uma cidade construída sobre um lago, com canais e mercados enormes, era a capital de qual povo?","o":["Astecas","Incas","Maias","Tupinambás"],"e":"Os incas tinham capital em Cusco e usavam os quipus, cordas com nós, para registros. Os maias formavam cidades-Estado e criaram escrita e calendários precisos."},{"t":11,"y":"1519–21","q":"Como Hernán Cortés, com poucas centenas de espanhóis, derrotou o Império Asteca?","o":["Alianças indígenas e epidemias","Só a superioridade das armas","Rendição asteca sem combate","Ajuda militar do exército inca"],"e":"Milhares de tlaxcaltecas lutaram ao lado de Cortés, e a varíola matou multidões. O mesmo padrão se repetiu com Pizarro no Peru."},{"t":11,"q":"A mita, usada pelos espanhóis nas minas de prata de Potosí, era...","o":["Trabalho indígena obrigatório por turnos","Imposto pago em ouro pelos colonos","Festa religiosa em honra ao Sol","Tipo de embarcação usada pelos espanhóis no Pacífico"],"e":"Potosí produziu prata em quantidade absurda à custa de muitas vidas indígenas. Já a encomienda dava a um colono o direito de explorar o trabalho de um grupo indígena."},{"t":11,"y":"1500","q":"Por que hoje muitos preferem falar em “chegada” ou até “invasão”, e não “descobrimento” do Brasil?","o":["A terra já era habitada por milhões","Os portugueses nunca chegaram aqui","Os holandeses tinham chegado antes dos portugueses","Cabral chegou por engano à África"],"e":"Na carta de Pero Vaz de Caminha, os indígenas já aparecem fazendo escambo. “Descobrir” supõe que não havia ninguém, e havia povos com línguas, territórios e histórias próprias."},{"t":12,"q":"Na Primeira República, a “política do café com leite” era...","o":["Alternância de SP e MG na presidência","Um programa federal de merenda escolar","Um acordo comercial com a Argentina","Política de imigração de italianos"],"e":"São Paulo (café) e Minas Gerais (leite) dominavam a política, apoiados nos coronéis e no voto de cabresto."},{"t":12,"q":"O voto de cabresto funcionava porque...","o":["O voto era aberto e vigiado","O voto era secreto e eletrônico","Só as mulheres podiam votar","Ninguém era obrigado a votar"],"e":"Sem voto secreto, o coronel sabia em quem cada um votava. Somado à fraude, isso garantia os resultados. O voto secreto só veio com o Código Eleitoral de 1932."},{"t":12,"y":"1896–97","q":"No sertão da Bahia, a comunidade liderada por Antônio Conselheiro foi destruída pelo Exército republicano. Que conflito foi esse?","o":["Guerra de Canudos","Revolta da Vacina","Guerra do Contestado","Revolta da Armada"],"e":"Euclides da Cunha cobriu a guerra e escreveu Os Sertões. A República tratou sertanejos pobres como inimigos monarquistas."},{"t":12,"y":"1943","q":"Getúlio Vargas reuniu as leis trabalhistas na CLT. Ao mesmo tempo, o Estado Novo (1937–45) tinha o DIP. Pra que servia o DIP?","o":["Censurar a imprensa e fazer propaganda","Fiscalizar fábricas e proteger operários","Organizar eleições livres e diretas","Administrar a recém-criada Petrobras"],"e":"Vargas foi o “pai dos pobres” e também um ditador: direitos trabalhistas de um lado, censura, prisões e propaganda de outro. As duas coisas fazem parte da Era Vargas."},{"t":12,"y":"1904","q":"No Rio de Janeiro, a população se revoltou contra a vacinação obrigatória comandada por Oswaldo Cruz. Por quê?","o":["Imposição à força e demolição de cortiços","As pessoas queriam a vacina, mas não havia doses","Militares exigiam aumento de salário","Imigrantes queriam voltar para a Europa"],"e":"Não era só medo da vacina: a reforma urbana tinha expulsado os pobres do centro, e agentes entravam nas casas sem pedir. A revolta juntou tudo isso."},{"t":13,"y":"1953","q":"Com o slogan “O petróleo é nosso”, o governo Vargas criou...","o":["A Petrobras","A Companhia Siderúrgica Nacional","O Banco do Brasil","A Vale do Rio Doce"],"e":"A Petrobras nasceu com monopólio estatal do petróleo, depois de uma grande campanha popular nacionalista."},{"t":13,"y":"1954","q":"“Saio da vida para entrar na História.” Essa frase é de...","o":["Carta-testamento de Vargas","Discurso de posse de JK","Juramento de Tiradentes","Discurso de Jango na Central do Brasil"],"e":"Pressionado por uma grave crise política, Vargas se suicidou em agosto de 1954. A comoção popular adiou por anos os planos de golpe."},{"t":13,"y":"1956–61","q":"“50 anos em 5”: qual era a marca do governo Juscelino Kubitschek?","o":["Indústria automobilística e Brasília","Reforma agrária radical no campo","Fechamento do Congresso Nacional","Estatização das empresas estrangeiras"],"e":"Brasília foi inaugurada em 1960. O preço veio depois: inflação alta e dívida externa."},{"t":13,"y":"1964","q":"As Reformas de Base de João Goulart (agrária, urbana, educacional...) foram usadas como pretexto para...","o":["O golpe civil-militar de 1964","A renúncia de Jânio Quadros","A adoção do parlamentarismo em 1961","A volta de Vargas ao poder"],"e":"Militares, empresários, parte da imprensa e da classe média apoiaram o golpe, por isso “civil-militar”. Começaram 21 anos de ditadura."},{"t":13,"y":"1968","q":"O AI-5, o mais duro dos atos institucionais, permitiu...","o":["Fechar o Congresso e censurar","Convocar eleições diretas","Libertar presos políticos","Promulgar a Constituição de 1988"],"e":"Com o AI-5 começam os “anos de chumbo”, com tortura e desaparecimentos. Ele só foi revogado em 1978."},{"t":14,"y":"1988","q":"A Constituição de 1988 ganhou o apelido de...","o":["Constituição Cidadã","Constituição Polaca","Carta Outorgada","Constituição do Café"],"e":"Assim a chamou Ulysses Guimarães. Ela ampliou direitos sociais, criou o SUS, garantiu voto ao analfabeto e definiu o racismo como crime inafiançável. A “Polaca” foi a de 1937, do Estado Novo."},{"t":14,"y":"1994","q":"Em 1993 a inflação chegou a 2.477% ao ano. Em 1998 estava em 1,7%. O que derrubou esse número?","o":["O Plano Real","O AI-5","A Lei de Cotas","A criação da Petrobras"],"e":"Com a URV e depois o real, a hiperinflação acabou. Antes disso, o preço no supermercado mudava de manhã para a tarde."},{"t":14,"y":"2006","q":"A Lei Maria da Penha trata de quê?","o":["Violência doméstica contra a mulher","Cotas para mulheres nas eleições","Licença-maternidade remunerada","Igualdade salarial entre os gêneros"],"e":"Maria da Penha Fernandes sobreviveu a duas tentativas de feminicídio e lutou quase 20 anos por justiça. Em 2015, a Lei do Feminicídio tornou crime hediondo o assassinato de mulheres por razões de gênero."},{"t":14,"q":"O “mito da democracia racial” é a ideia de que no Brasil não existe racismo porque houve muita mistura. Por que é chamado de mito?","o":["Os dados mostram desigualdade racial","Nunca houve escravidão no Brasil","A Constituição proíbe falar de raça no Brasil","Todos os brasileiros ganham igual"],"e":"Em 2018, segundo o IBGE, o rendimento médio de pessoas brancas era de R$ 2.796; o de pretos e pardos, R$ 1.608. Essa desigualdade é herança da escravidão e de uma abolição sem integração."},{"t":14,"y":"2012","q":"A Lei de Cotas reserva vagas em universidades e institutos federais para...","o":["Alunos de escola pública, com recorte racial","Atletas de alto rendimento em todo o país","Filhos de servidores públicos federais","Estudantes estrangeiros vindos de intercâmbio"],"e":"É uma política de ação afirmativa: tratar de forma diferente quem partiu de condições desiguais, para chegar mais perto da igualdade."},{"t":1,"q":"Jesuítas e colonos viviam em conflito na América portuguesa. Qual alternativa explica melhor essa disputa?","o":["Os dois exploravam o indígena, mas disputavam o controle do seu trabalho","Os jesuítas queriam que os indígenas vivessem isolados, sem nenhum contato europeu","Os colonos defendiam a catequese e os jesuítas, a escravização indígena","A disputa era só religiosa e não envolvia trabalho, terra ou poder"],"e":"Os aldeamentos também impunham catequese, trabalho e mudança de costumes. O choque com os colonos era sobre quem controlaria a mão de obra indígena.","d":2},{"t":1,"q":"Bandeirantes dão nome a rodovias e monumentos em São Paulo. Uma leitura crítica dessa memória lembra que eles...","o":["Também capturaram indígenas e atacaram quilombos","Foram pioneiros na defesa dos direitos indígenas","Nunca saíram do litoral e não ampliaram o território","Eram funcionários espanhóis encarregados da fronteira"],"e":"A expansão territorial veio junto com escravização e violência. O debate sobre monumentos, como o Borba Gato, é um debate sobre memória.","d":2},{"t":2,"y":"1711","q":"O padre Antonil escreveu que os escravizados eram “as mãos e os pés do senhor de engenho”. A frase revela...","o":["A dependência da economia açucareira em relação ao trabalho escravizado","Que os senhores de engenho trabalhavam lado a lado com os escravizados no canavial","Que o açúcar era produzido principalmente por trabalhadores livres","Que a escravidão tinha pouco peso na produção colonial de açúcar"],"e":"Antonil descrevia o engenho por dentro. Sem o trabalho forçado de africanos e descendentes, a máquina do açúcar não funcionava.","d":2},{"t":2,"q":"Comparada à sociedade açucareira, a sociedade mineradora do século XVIII era...","o":["Mais urbana e diversa, mas escravista e vigiada pela Coroa","Igualitária, sem escravidão e sem cobrança de impostos","Mais rural e isolada, sem cidades nem comércio interno","Controlada pelos holandeses e voltada ao comércio africano"],"e":"Havia artesãos, comerciantes, artistas como o Aleijadinho e irmandades. Mas a base continuava escravista, e o fisco português era pesado.","d":2},{"t":3,"y":"1831","q":"A primeira lei que proibiu o tráfico de africanos, de 1831, ficou conhecida como lei “para inglês ver”. Por quê?","o":["Existia para agradar a Inglaterra, mas não era cumprida","Valia só para navios ingleses que chegavam ao Brasil","Foi escrita só em inglês e quase ninguém no Brasil conseguia entendê-la","Proibia ingleses de assistir aos leilões de escravos"],"e":"Depois dela, centenas de milhares de africanos ainda entraram de forma ilegal. Só a lei de 1850, com pressão inglesa, acabou de fato com o tráfico.","d":2},{"t":3,"q":"Historiadores ampliaram a ideia de resistência à escravidão. Qual exemplo entra nessa visão ampliada?","o":["Irmandades, compra de alforria e negociação de direitos","Somente as grandes revoltas armadas contra os senhores e feitores","Apenas a fuga individual para as cidades do litoral","Unicamente os quilombos com mais de mil moradores"],"e":"Resistir também era negociar folgas, juntar pecúlio, manter cultos e laços de família. A resistência cotidiana era tão importante quanto a rebelião.","d":2},{"t":4,"q":"Hobbes e Locke usaram a ideia de contrato social. A principal diferença entre eles é que...","o":["Só Locke admite resistir a um governo que viola direitos","Os dois defendem o absolutismo por direito divino","Só Hobbes usa a ideia de um contrato entre as pessoas","Locke defende poder ilimitado; Hobbes, poderes separados"],"e":"Para Hobbes, o contrato cria um soberano absoluto. Para Locke, o governo é limitado e pode ser derrubado se virar tirano.","d":2},{"t":4,"q":"Qual diferença separa o mercantilismo do liberalismo de Adam Smith?","o":["Para Smith, riqueza vem do trabalho e da troca livre","Para Smith, a riqueza era o ouro guardado nos cofres do rei","Mercantilistas eram contra a ação do Estado","Os dois queriam acabar com todas as colônias"],"e":"O mercantilismo media a riqueza em metais e defendia protecionismo. Smith via a riqueza no trabalho produtivo e criticava os monopólios.","d":2},{"t":5,"y":"1834","q":"A Nova Lei dos Pobres, aprovada na Inglaterra em 1834, determinou que...","o":["A ajuda aos pobres exigia viver em duras casas de trabalho","Camponeses expulsos receberiam de volta as terras comunais","Operários teriam salário mínimo e jornada de oito horas","O trabalho infantil ficava proibido em todas as fábricas"],"e":"As workhouses eram propositalmente duras, para empurrar os pobres ao trabalho nas fábricas por qualquer salário.","d":2},{"t":5,"q":"Qual é a relação entre os cercamentos e o surgimento das fábricas?","o":["Camponeses sem terra viraram mão de obra fabril","A fábrica nasceu para empregar nobres sem terras","Os cercamentos devolveram terras aos camponeses","A indústria surgiu no campo, longe das cidades"],"e":"Expulsos do campo, os camponeses só tinham a própria força de trabalho para vender. Foi a matéria-prima humana da Revolução Industrial.","d":2},{"t":6,"q":"O 13 de maio já foi celebrado como “presente da princesa”, e hoje o 20 de novembro celebra a resistência negra. Isso mostra que...","o":["Datas comemorativas são disputas de memória","A história oficial é neutra e nunca muda","Só documentos escritos definem feriados","O movimento negro rejeita estudar a abolição"],"e":"Escolher uma data é escolher quem é protagonista. A história crítica estuda essas disputas em vez de aceitar uma versão única.","d":2},{"t":6,"q":"As datações de sítios como a Serra da Capivara, no Piauí, são importantes porque...","o":["Questionam quando os humanos chegaram à América","Provam que os humanos surgiram na América","Mostram que a América foi povoada por europeus","Provam que nunca houve passagem humana pelo estreito de Bering"],"e":"A hipótese clássica falava em migração pela Beríngia há uns 13 mil anos. Achados mais antigos, ainda debatidos, abrem outras possibilidades, como rotas costeiras.","d":2},{"t":7,"q":"Aristóteles afirmava que algumas pessoas eram “escravas por natureza”. Isso mostra que...","o":["A filosofia grega também justificava a escravidão","Os gregos foram os primeiros abolicionistas","A filosofia não tinha relação com a política","Aristóteles defendia a cidadania dos escravizados"],"e":"A democracia ateniense convivia com a escravidão, e seus pensadores a explicavam como natural. Valorizar a Grécia não exige ignorar isso.","d":2},{"t":7,"y":"431–404 a.C.","q":"Qual foi uma consequência da Guerra do Peloponeso, entre Atenas e Esparta?","o":["O enfraquecimento das pólis, abrindo espaço à Macedônia","A unificação de toda a Grécia sob a democracia de Atenas","O surgimento do Império Romano no Mediterrâneo","O fim da escravidão em todas as cidades gregas"],"e":"Esparta venceu, mas as pólis saíram exaustas. Décadas depois, Filipe II e Alexandre, da Macedônia, dominaram a Grécia.","d":2},{"t":8,"y":"133–121 a.C.","q":"Os irmãos Tibério e Caio Graco, tribunos da plebe, foram assassinados por...","o":["Propor dividir terras públicas entre os pobres","Defender a volta da monarquia etrusca e o fim do Senado","Comandar a revolta de Espártaco","Converter o império ao cristianismo"],"e":"Grandes proprietários ocupavam as terras públicas. A reforma agrária dos Graco ameaçou a elite senatorial, que reagiu com violência.","d":2},{"t":8,"y":"212","q":"O Édito de Caracala, de 212, é importante porque...","o":["Deu cidadania a quase todos os livres do império","Libertou todos os escravizados de Roma","Tornou o cristianismo a religião oficial","Dividiu o império em duas partes, entre Ocidente e Oriente"],"e":"Ser cidadão romano deixou de ser privilégio de poucos. Uma das motivações era ampliar a cobrança de impostos.","d":2},{"t":9,"y":"séc. XI–XIII","q":"Qual alternativa descreve o renascimento comercial e urbano da Baixa Idade Média?","o":["Feiras, rotas de comércio e cidades mais autônomas","O fechamento do Mediterrâneo ao comércio logo após as Cruzadas","A volta da população europeia para o campo","A proibição do uso de moedas pela Igreja"],"e":"Feiras como as de Champagne e cidades que compravam cartas de franquia fizeram surgir a burguesia.","d":2},{"t":9,"q":"O que as igrejas escavadas na rocha de Lalibela, na Etiópia, e as muralhas do Grande Zimbábue mostram?","o":["Que a África medieval teve Estados e arquitetura monumental","Que a África só teve cidades com a chegada dos europeus","Que os reinos africanos não comerciavam com outras regiões","Que as igrejas de Lalibela foram construídas por portugueses"],"e":"Essas obras derrubam a ideia de uma África “sem história” antes dos europeus. O Grande Zimbábue foi centro de rotas de ouro no Índico.","d":2},{"t":10,"q":"Bossuet e Hobbes defenderam o absolutismo. A diferença entre eles é que...","o":["Bossuet usou o direito divino; Hobbes, um contrato","Bossuet era democrata; Hobbes, parlamentarista","Hobbes usou o direito divino; Bossuet, a separação dos poderes","Os dois rejeitavam um poder forte e central"],"e":"Para Bossuet, o rei é representante de Deus. Para Hobbes, as pessoas entregam o poder ao soberano para escapar da guerra de todos contra todos.","d":2},{"t":10,"q":"O calvinismo, segundo o sociólogo Max Weber, ajudou o capitalismo por valorizar...","o":["A predestinação, o trabalho e o lucro","As indulgências e o culto aos santos","A obediência ao papa e o celibato","A rejeição de todo tipo de comércio e de lucro"],"e":"Sucesso no trabalho podia ser visto como sinal de salvação. Essa ética favorecia poupar, investir e trabalhar com disciplina.","d":2},{"t":11,"q":"Por que doenças como a varíola tiveram efeito devastador na conquista da América?","o":["Os indígenas não tinham imunidade às doenças europeias","Os europeus também morreram em massa assim que chegaram à América","As epidemias atingiram apenas cidades europeias","A população indígena cresceu após o contato"],"e":"Em algumas regiões, a população indígena caiu até 90% no primeiro século. As epidemias desorganizaram sociedades antes mesmo das batalhas.","d":2},{"t":11,"y":"1780","q":"A rebelião de Túpac Amaru II, no Peru, foi...","o":["Uma revolta indígena contra os abusos coloniais","A independência do México liderada por criollos","A resistência asteca contra Cortés","Uma rebelião de colonos ingleses"],"e":"Ele adotou o nome do último imperador inca e atacou a mita e os corregedores. Foi executado em 1781, mas virou símbolo de resistência.","d":2},{"t":12,"q":"Os tenentes dos anos 1920 criticavam as oligarquias, mas...","o":["Confiavam pouco na participação popular","Queriam a volta da monarquia brasileira","Controlavam o voto de cabresto no sertão","Apoiavam a política do café com leite"],"e":"Defendiam voto secreto e moralização, mas imaginavam que a mudança viria dos militares, não do povo. Muitos tenentes ocuparam cargos com Vargas.","d":2},{"t":12,"q":"Na Primeira República, como o Estado costumava responder às greves operárias?","o":["Tratando a questão social como caso de polícia","Financiando os sindicatos com verba federal","Proibindo greves somente para mulheres","Garantindo aos grevistas todos os direitos previstos na CLT"],"e":"Prisões, repressão e expulsão de imigrantes militantes eram comuns. A CLT só viria em 1943.","d":2},{"t":13,"y":"1945–64","q":"A UDN, partido de Carlos Lacerda, era...","o":["Antigetulista, liberal e forte na classe média","O partido dos trabalhadores ligado a Vargas","O partido das elites rurais formado pelos antigos interventores","Um partido comunista na clandestinidade"],"e":"O PTB era o partido trabalhista de Vargas, e o PSD reunia elites ligadas aos antigos interventores. A UDN fazia oposição a ambos.","d":2},{"t":13,"y":"1964","q":"Por que muitos historiadores chamam o golpe de 1964 de “civil-militar”?","o":["Teve apoio de empresários, imprensa e políticos","Foi feito apenas por civis, sem nenhuma participação do Exército","Foi aprovado em um plebiscito nacional","Foi liderado por sindicatos e estudantes"],"e":"Governadores, parte da imprensa, entidades empresariais e setores da Igreja apoiaram a derrubada de Jango. Os militares comandaram o regime.","d":2},{"t":14,"q":"Pesquisas do IBGE mostram que mulheres dedicam cerca de 21 horas semanais a afazeres domésticos, e homens, cerca de 11. Esse dado ajuda a explicar...","o":["A dupla jornada e a desigualdade no mercado de trabalho","Que as mulheres já ganham mais que os homens no Brasil","Que o trabalho doméstico das mulheres é pago pelo Estado brasileiro","Que a desigualdade de gênero acabou com a Constituição"],"e":"Menos tempo livre significa menos chances de estudar, ser promovida ou trabalhar em tempo integral. É um traço do patriarcalismo.","d":2},{"t":14,"q":"Sobre as privatizações dos anos 1990, qual alternativa apresenta o debate corretamente?","o":["Defensores viam eficiência; críticos, perda de patrimônio","Todos os economistas concordavam que eram um erro","Aconteceram durante a ditadura militar, sem nenhum debate público","Transformaram empresas privadas em estatais"],"e":"Um lado falava em investimento e modernização; o outro, em venda barata de empresas estratégicas e desemprego. Saber apresentar os dois lados cai em prova.","d":2}]},"2":{"temas":["Do artesanato à fábrica: 1ª e 2ª Revolução Industrial","A classe operária e a luta por direitos","Nações e nacionalismos: Primavera dos Povos e unificações","Ideias sociais e projetos revolucionários","Destino Manifesto e capitalismo monopolista","Revolução Francesa e era napoleônica","Crise do sistema colonial","Emancipação política e formação do Estado","Segundo Reinado: identidade nacional, café e indústria","Da mão de obra escravizada à imigração","Proclamação e Primeira República","Movimentos sociais e Era Vargas até o Estado Novo"],"q":[{"t":1,"y":"séc. XVIII","q":"Por que a Revolução Industrial começou na Inglaterra, e não em outro país?","o":["Capital, carvão, mão de obra e Parlamento burguês","Era o único país europeu cortado por rios","Não tinha colônias nem comércio exterior","O rei inglês proibiu a agricultura para forçar a indústria"],"e":"Foi a soma de fatores: dinheiro para investir, matéria-prima no subsolo, gente disponível para trabalhar e um governo, desde 1688, alinhado com os negócios."},{"t":1,"q":"Qual dupla resume a energia e o setor-símbolo da 1ª Revolução Industrial?","o":["Vapor e indústria têxtil","Eletricidade e automóveis","Petróleo e química fina","Energia nuclear e informática"],"e":"O vapor, aperfeiçoado por James Watt, movia teares e locomotivas, alimentado por carvão. Eletricidade, petróleo, aço e química são marcas da 2ª Revolução, a partir de 1870."},{"t":1,"y":"1913","q":"Henry Ford implantou na fábrica do Modelo T uma novidade que barateou o carro. Qual?","o":["A linha de montagem","A produção artesanal","O trabalho domiciliar","A proibição de máquinas"],"e":"No fordismo, cada operário repete uma tarefa enquanto a esteira traz a peça. Taylor já propunha cronometrar e dividir cada movimento. Resultado: muito mais produção e trabalho mais repetitivo."},{"t":1,"q":"Do artesanato à maquinofatura, o que o trabalhador perdeu?","o":["O controle do processo de trabalho","O direito de receber salário","A necessidade de trabalhar todo dia","O contato com outros trabalhadores"],"e":"O artesão era dono das ferramentas e fazia o produto inteiro. Na fábrica, as máquinas são do patrão e o operário vira uma peça do processo, vendendo só sua força de trabalho."},{"t":1,"q":"Nas primeiras fábricas inglesas, por que havia tantas crianças trabalhando?","o":["Ganhavam menos e eram mais controláveis","A lei obrigava todas as crianças a trabalhar","As escolas pagavam para as fábricas","Só crianças sabiam operar o vapor"],"e":"Crianças entravam nas minas e nas máquinas por serem pequenas, baratas e obedientes. Leis como a de 1833 começaram, devagar, a limitar a jornada infantil."},{"t":2,"y":"1886","q":"Por que o 1º de maio é o Dia do Trabalhador no mundo todo?","o":["Lembra a luta pelas 8 horas em Chicago","É o dia da assinatura da CLT no Brasil","Marca o fim da Revolução Francesa","Celebra o aniversário de Karl Marx"],"e":"Em maio de 1886, uma bomba explodiu num ato na praça Haymarket, a polícia atirou e operários anarquistas foram condenados sem provas. Virou símbolo da luta por direitos."},{"t":2,"q":"“Oito horas de trabalho, oito de descanso, oito de lazer.” O que esse lema reivindicava?","o":["Jornada de 8 horas diárias","Fim do pagamento de salários","Volta ao trabalho no campo","Mais horas extras remuneradas"],"e":"Jornadas de 14 a 16 horas eram comuns. A luta pelas 8 horas atravessou o século XIX e só virou lei em muitos países no século XX."},{"t":2,"y":"1838","q":"Os cartistas ingleses ficaram conhecidos por uma petição, a Carta do Povo. O que ela pedia?","o":["Voto universal masculino e secreto","A volta do absolutismo na Inglaterra","O fim das eleições parlamentares","A destruição das máquinas das fábricas"],"e":"Os cartistas apostaram na política: com voto, os operários poderiam mudar as leis. As petições foram rejeitadas, mas quase todas as demandas viraram lei depois."},{"t":2,"q":"As trade unions inglesas eram...","o":["Sindicatos de trabalhadores","Companhias de comércio colonial","Partidos dos donos de fábricas","Bancos públicos de crédito"],"e":"Proibidas no início pelas Combination Acts, as associações operárias foram legalizadas aos poucos e viraram ferramenta de greve e negociação."},{"t":2,"q":"Qual foi a diferença entre luditas e cartistas na luta operária?","o":["Luditas quebravam máquinas; cartistas queriam voto","Luditas queriam voto; cartistas quebravam máquinas","Os dois grupos defendiam o fim dos sindicatos","Os dois eram associações de donos de fábrica"],"e":"São estratégias diferentes de um mesmo período: a ação direta contra a máquina e a pressão política organizada."},{"t":3,"y":"1848","q":"A “Primavera dos Povos” foi...","o":["Revoluções liberais e nacionalistas na Europa","Um festival de flores e artes em Paris","A onda de independências das colônias europeias na África","O fim da Segunda Guerra Mundial na Europa"],"e":"França, Áustria, estados alemães e italianos, Hungria... Quase todas as revoltas foram derrotadas, mas as ideias de nação e de direitos ficaram."},{"t":3,"q":"Na unificação italiana, quem liderou os “camisas vermelhas” na conquista do sul?","o":["Giuseppe Garibaldi","Otto von Bismarck, o chanceler","Napoleão III","Conde de Cavour"],"e":"Cavour, ministro do Piemonte-Sardenha, articulou a diplomacia; Garibaldi conquistou o Reino das Duas Sicílias e o entregou a Vítor Emanuel II. Roma só entrou em 1870."},{"t":3,"y":"1871","q":"Bismarck dizia que a Alemanha seria unificada não por discursos, mas por...","o":["“Ferro e sangue”","“Pão e circo”","“Ordem e progresso”","“Liberdade e igualdade”"],"e":"A Prússia venceu três guerras (Dinamarca, Áustria e França). O Império Alemão foi proclamado em Versalhes, e a França perdeu a Alsácia-Lorena, uma ferida que pesaria em 1914."},{"t":3,"q":"O que é uma nação, na visão de muitos historiadores?","o":["Comunidade de língua, história e símbolos","Grupo que existe igual desde a Pré-História","Qualquer território governado por um rei","Uma população com a mesma religião oficial"],"e":"Benedict Anderson chamou a nação de “comunidade imaginada”: escola, jornais, hinos e mapas ajudam a criar o sentimento de pertencer."},{"t":3,"q":"O Zollverein, criado em 1834, ajudou a unificar a Alemanha porque era...","o":["Uma união aduaneira","Um exército austríaco","Uma igreja nacional","Uma ferrovia até Roma"],"e":"Antes de virar um país, a Alemanha virou um mercado comum, liderado pela Prússia. A economia abriu caminho para a política."},{"t":4,"y":"1848","q":"“Proletários de todos os países, uni-vos!” Essa frase encerra...","o":["O Manifesto Comunista","A Declaração de 1789","A Riqueza das Nações, de Smith","O Contrato Social"],"e":"Para Marx e Engels, a história é a história da luta de classes. A burguesia explorava o proletariado, que deveria se organizar e tomar o poder."},{"t":4,"q":"Robert Owen, Saint-Simon e Fourier foram chamados de socialistas utópicos porque...","o":["Propunham sociedades ideais e cooperativas","Defendiam o absolutismo e a nobreza","Queriam destruir as fábricas pela força das armas","Eram contra qualquer mudança social"],"e":"Owen chegou a criar comunidades-modelo, como New Harmony, nos EUA. Marx chamou essa proposta de “utópica” para diferenciá-la do seu socialismo “científico”."},{"t":4,"q":"Qual era a principal diferença entre anarquistas e marxistas?","o":["Anarquistas queriam extinguir o Estado já","Anarquistas defendiam o rei e o papa","Anarquistas apoiavam a propriedade privada","Não havia diferença entre os dois grupos"],"e":"Proudhon e Bakunin viam no Estado uma forma de opressão em si. Essa divergência rachou a Associação Internacional dos Trabalhadores."},{"t":4,"y":"1871","q":"A Comuna de Paris foi...","o":["Governo operário de 72 dias, esmagado","A fundação da República Francesa em 1789","Uma festa popular de verão em Paris","Um banco estatal criado por Napoleão"],"e":"A Comuna separou Igreja e Estado, criou ensino laico e abriu mão de salários altos para cargos públicos. Na “Semana Sangrenta”, milhares de pessoas foram mortas."},{"t":4,"q":"Para Marx, a mais-valia é...","o":["Valor produzido além do salário","Um imposto cobrado pelo Estado","Lucro sobre produtos importados","O salário mínimo dos operários"],"e":"Se o operário produz em 4 horas o valor do seu salário, as outras horas da jornada geram riqueza para o capitalista. Daí a luta pela redução da jornada."},{"t":5,"y":"séc. XIX","q":"O “Destino Manifesto” era a crença de que...","o":["Os EUA tinham missão divina de expandir-se","Os indígenas eram os donos legítimos do Oeste","Os EUA deviam voltar a ser colônia inglesa","O México deveria governar toda a América"],"e":"A ideia justificou guerras, compra de territórios e a expulsão de povos indígenas. Na guerra de 1846–48, o México perdeu cerca de metade do seu território."},{"t":5,"y":"1838","q":"A “Trilha das Lágrimas” foi...","o":["Expulsão forçada dos cherokees","Uma rota de ouro na Califórnia","A primeira ferrovia dos EUA","Uma marcha pacífica de colonos"],"e":"A Lei de Remoção dos Índios (1830) obrigou povos inteiros a deixar suas terras. Depois vieram as reservas e o extermínio dos bisões."},{"t":5,"y":"1862","q":"O Homestead Act incentivou a ocupação do Oeste porque...","o":["Dava terras a quem as cultivasse","Proibia a moradia no Oeste","Devolvia terras aos indígenas","Vendia terras somente para grandes empresas"],"e":"Cerca de 65 hectares por família. Compare com o Brasil: aqui, a Lei de Terras de 1850 fez o contrário, e a terra só podia ser comprada."},{"t":5,"q":"John D. Rockefeller e sua Standard Oil chegaram a controlar cerca de 90% do refino de petróleo nos EUA. Isso é exemplo de...","o":["Truste, ou monopólio","Socialismo de mercado","Livre concorrência","Agricultura familiar"],"e":"Trustes juntavam empresas para dominar o mercado e ditar preços. Em 1890, a Lei Sherman tentou combatê-los, e a Standard Oil acabou dividida em 1911."},{"t":5,"q":"O mito do self-made man dizia que qualquer um enriquece com esforço próprio. O que ele escondia?","o":["Desigualdades de origem e exclusões","Que os EUA eram uma monarquia","Que ninguém trabalhava nas fábricas","Que todos já nasciam com fortuna"],"e":"Histórias como a de Andrew Carnegie existiram, mas eram exceção. O mito ajudava a culpar os pobres pela própria pobreza."},{"t":6,"y":"1789","q":"No Antigo Regime francês, o Terceiro Estado era...","o":["A maioria, que pagava os impostos","O clero, isento de impostos e dono de terras","A nobreza, dona das terras","A família real e a corte"],"e":"Clero e nobreza tinham privilégios e quase não pagavam impostos. O Terceiro Estado, cerca de 97% da população, sustentava o sistema."},{"t":6,"y":"14/07/1789","q":"Qual acontecimento virou o símbolo do início da Revolução Francesa?","o":["A tomada da Bastilha","A coroação de Napoleão","O Congresso de Viena","A execução de Robespierre"],"e":"A Bastilha era uma prisão-fortaleza, símbolo do poder absoluto do rei. Hoje, 14 de julho é a data nacional da França."},{"t":6,"y":"1791","q":"Olympe de Gouges escreveu a Declaração dos Direitos da Mulher e da Cidadã. O que ela denunciava?","o":["A exclusão das mulheres dos direitos","A igualdade já conquistada pelas mulheres","A necessidade de o rei voltar ao poder","A justiça da escravidão nas colônias"],"e":"“Homem e cidadão” era literal. Olympe foi guilhotinada em 1793, durante o Terror."},{"t":6,"q":"Na Convenção, os jacobinos se diferenciavam dos girondinos por...","o":["Eram mais radicais e ligados aos sans-culottes","Defendiam a volta do absolutismo e dos privilégios de Luís XVI","Representavam apenas a nobreza do interior","Eram contra a república e a favor do rei"],"e":"Os girondinos representavam a alta burguesia. Os jacobinos comandaram o Terror e a Lei do Máximo, que tabelava preços."},{"t":6,"y":"1806","q":"O Bloqueio Continental de Napoleão tem tudo a ver com o Brasil. Por quê?","o":["Portugal o ignorou e a corte fugiu para o Rio","Napoleão invadiu o Rio de Janeiro em 1806","O Brasil declarou guerra direta à França","A França proibiu a entrada do café brasileiro na Europa"],"e":"Aliado dos ingleses, Portugal ficou entre a cruz e a espada. A corte fugiu escoltada pela marinha britânica."},{"t":6,"y":"1815","q":"Depois da derrota de Napoleão, o Congresso de Viena tentou...","o":["Restaurar as monarquias anteriores","Espalhar a república pela Europa","Criar uma união econômica europeia","Libertar todas as colônias americanas"],"e":"Princípio da legitimidade e Santa Aliança para conter revoluções. Mas as ideias de 1789 já tinham se espalhado e voltariam em 1830 e 1848."},{"t":7,"y":"1789","q":"A Inconfidência Mineira foi um movimento...","o":["Da elite mineira contra a derrama","De escravizados pela abolição imediata","De indígenas contra os jesuítas","De operários pelas 8 horas de trabalho"],"e":"Poetas, padres, militares e proprietários planejavam uma república. Denunciados, foram presos, e só Tiradentes, o de menor posição social, foi enforcado, em 1792."},{"t":7,"y":"1798","q":"O que tornou a Conjuração Baiana, ou dos Alfaiates, diferente da Mineira?","o":["Participação popular e fim da escravidão","Formada só por fazendeiros ricos","Queria manter o Brasil ligado a Portugal","Aconteceu no Rio Grande do Sul"],"e":"Alfaiates, soldados e escravizados espalharam panfletos em Salvador inspirados na Revolução Francesa e no Haiti. Quatro homens negros e pardos foram enforcados."},{"t":7,"y":"1808","q":"Logo ao chegar ao Brasil, D. João assinou a abertura dos portos às nações amigas. Na prática, isso significou...","o":["Fim do monopólio comercial português","Proibição de todo comércio externo","Independência imediata do Brasil","Volta do pacto colonial e do monopólio de Lisboa"],"e":"Em 1810, os tratados com a Inglaterra deram a produtos ingleses tarifa de 15%, menor até que a de Portugal (16%)."},{"t":7,"q":"A historiadora Maria Odila Leite da Silva Dias falou em “interiorização da metrópole”. O que é isso?","o":["A corte no Rio enraizou as elites locais","A capital portuguesa mudou para o sertão","Os portugueses abandonaram o litoral","O Brasil passou a governar a África"],"e":"Com a corte aqui, o Rio virou centro do império: Banco do Brasil, imprensa, Jardim Botânico e, em 1815, Reino Unido a Portugal e Algarves."},{"t":8,"y":"1820","q":"A Revolução do Porto, em Portugal, acelerou a independência do Brasil porque...","o":["As Cortes queriam recolonizar o Brasil","Proclamou a independência do Brasil","Acabou com a monarquia em Portugal e criou uma república","Uniu Brasil e Espanha num só reino"],"e":"A elite brasileira não queria perder o que tinha ganhado desde 1808. Em 9 de janeiro de 1822, D. Pedro decidiu ficar: o Dia do Fico."},{"t":8,"y":"2/7/1823","q":"A independência foi só um grito às margens do Ipiranga?","o":["Não: houve guerras, como na Bahia","Sim, foi tudo pacífico e imediato","Sim, Portugal reconheceu no mesmo dia","Não, o Brasil foi colônia até 1889"],"e":"Bahia, Pará, Maranhão e Cisplatina tiveram combates, com participação de soldados negros, indígenas e de mulheres como Maria Quitéria."},{"t":8,"y":"1824","q":"A Constituição de 1824 criou um quarto poder, exclusivo do imperador. Qual?","o":["Poder Moderador","Poder Popular","Poder Judiciário","Poder Eclesiástico"],"e":"Com ele, D. Pedro podia dissolver a Câmara e nomear senadores. A Constituição foi outorgada (imposta) e o voto era censitário, por renda."},{"t":8,"y":"1824","q":"Frei Caneca foi executado por participar de qual movimento contra a centralização de D. Pedro I?","o":["Confederação do Equador","Revolução Farroupilha gaúcha","Cabanagem","Revolta da Vacina"],"e":"Pernambuco e províncias vizinhas reagiram à Constituição outorgada e propuseram uma república federativa. A repressão foi dura."},{"t":8,"y":"1831–40","q":"O período regencial ficou marcado por...","o":["Muitas revoltas nas províncias","Paz total e nenhum conflito","O reinado de D. Pedro II adulto","A abolição da escravidão"],"e":"Com D. Pedro II criança, regentes governavam e o país quase se fragmentou. O Golpe da Maioridade, em 1840, coroou o imperador aos 14 anos."},{"t":9,"q":"No Romantismo de José de Alencar, em obras como O Guarani e Iracema, o indígena aparece como...","o":["Herói idealizado e símbolo nacional","Inimigo selvagem a ser destruído pela nação","Personagem secundário e sem nome","Operário explorado nas fábricas"],"e":"Era preciso inventar uma identidade nacional diferente da portuguesa. O indígena, já distante no passado, virava herói; a escravidão ficava escondida."},{"t":9,"y":"1888","q":"O quadro “Independência ou Morte”, de Pedro Américo, pintado 66 anos depois do fato, é uma fonte sobre...","o":["Como o Império queria lembrar o fato","O que ocorreu em cada detalhe no Ipiranga","A vida cotidiana dos escravizados em 1822","A influência da Revolução Francesa no Brasil"],"e":"Pintura histórica é construção de memória. D. Pedro aparece heroico em cavalo imponente; na viagem, ele provavelmente montava uma mula."},{"t":9,"q":"O que foi a “modernização conservadora” do Segundo Reinado?","o":["Trens e telégrafo, sem mudar o latifúndio","Abolição imediata e reforma agrária ampla","Proibição de qualquer novidade tecnológica","Transformação imediata do país em república"],"e":"O café pagou trens e telégrafos, e o Barão de Mauá abriu indústrias e bancos. A estrutura social seguiu a mesma."},{"t":9,"q":"No Segundo Reinado, o café se espalhou primeiro pelo Vale do Paraíba e depois pelo...","o":["Oeste Paulista","Sertão nordestino","Pantanal mato-grossense","Litoral catarinense"],"e":"O Vale usou mão de obra escravizada e esgotou o solo. O Oeste Paulista, com terra roxa e ferrovias, recebeu muitos imigrantes."},{"t":9,"y":"1844","q":"A Tarifa Alves Branco aumentou os impostos sobre importados. Um efeito disso foi...","o":["Estimular indústrias nacionais","Acabar com a produção de café","Baratear os produtos ingleses","Abolir a escravidão no Império"],"e":"O objetivo principal era aumentar a arrecadação, mas o produto importado ficou mais caro, o que abriu espaço para a indústria local."},{"t":10,"y":"1850","q":"Duas semanas depois da Lei Eusébio de Queirós, veio a Lei de Terras. O que ela determinou?","o":["Terras só por compra","Lotes para cada liberto","Terras para os indígenas","Terras grátis a imigrantes"],"e":"Com o fim do tráfico à vista, a elite garantiu que libertos e imigrantes pobres não virassem donos de terra fácil, e continuassem trabalhando para os fazendeiros."},{"t":10,"q":"No sistema de colonato nas fazendas de café, o imigrante...","o":["Cuidava de pés de café e plantava sua roça","Recebia uma parte da fazenda de presente ao chegar","Trabalhava acorrentado como escravizado","Era funcionário público do Império"],"e":"Antes houve a parceria, como na fazenda Ibicaba, do Senador Vergueiro, em que os colonos começavam endividados. A revolta dos parceiros em 1856 ajudou a mudar o sistema."},{"t":10,"q":"O governo incentivou e até pagou a vinda de imigrantes europeus. Além da falta de braços, que ideia estava por trás disso?","o":["O “branqueamento” da população","Dar empregos aos libertos","Aumentar a população indígena no interior do país","Reduzir a produção de café"],"e":"Elites acreditavam que imigrantes brancos “melhorariam” o país. Ao mesmo tempo, libertos eram deixados de lado no mercado de trabalho."},{"t":10,"y":"1888","q":"Por que se diz que a abolição foi “inacabada”?","o":["Libertou sem terra, educação ou integração","A Lei Áurea só valia para as províncias do Nordeste","A escravidão continuou legal até 1950","Os senhores revogaram a lei depois"],"e":"A lei tinha dois artigos. As consequências aparecem até hoje em indicadores de renda, moradia e violência."},{"t":10,"y":"1884","q":"Qual província aboliu a escravidão antes da Lei Áurea, com ajuda dos jangadeiros que se recusaram a transportar escravizados?","o":["Ceará","São Paulo","Rio de Janeiro","Minas Gerais"],"e":"O jangadeiro Francisco José do Nascimento, o Dragão do Mar, virou símbolo. Amazonas também aboliu em 1884."},{"t":11,"y":"1889","q":"Aristides Lobo escreveu que o povo assistiu à Proclamação da República “bestializado”. O que ele quis dizer?","o":["O povo não participou nem entendeu","O povo fez uma grande revolução","Todos queriam a volta do imperador","Houve uma guerra civil no Rio"],"e":"A República nasceu de um golpe militar com apoio de cafeicultores. Para a maioria, foi uma troca de cima, sem participação."},{"t":11,"y":"1891","q":"A primeira Constituição republicana acabou com o voto censitário, mas excluiu...","o":["Analfabetos e mulheres","Apenas os estrangeiros","Ninguém, era universal","Apenas os fazendeiros"],"e":"Com a maioria analfabeta, pouquíssima gente votava. E o voto aberto abria caminho para o cabresto."},{"t":11,"q":"A Política dos Governadores, criada por Campos Sales, funcionava como uma troca de favores. Como?","o":["Apoio mútuo entre presidente e oligarquias","Governadores escolhidos pelo imperador","Congresso nomeando todos os prefeitos","Os estados passaram a ser governados direto pelo Exército"],"e":"Na base da pirâmide, os coronéis entregavam os votos. Uma Comissão Verificadora ainda “degolava” opositores eleitos."},{"t":11,"y":"1912–16","q":"No Paraná e em Santa Catarina, camponeses expulsos para a construção de uma ferrovia seguiram líderes religiosos e enfrentaram o Exército. Que conflito foi esse?","o":["Guerra do Contestado","Guerra de Canudos (Bahia)","Revolta da Chibata","Balaiada"],"e":"A empresa ferroviária recebeu terras dos dois lados da linha, e quem morava ali foi expulso. Como em Canudos, a resposta do governo foi militar."},{"t":11,"y":"1910","q":"Marinheiros, em sua maioria negros, liderados por João Cândido, tomaram navios no Rio para exigir...","o":["O fim dos castigos com chibata","O direito de voto das mulheres","A volta da monarquia ao Brasil","O aumento do preço do café"],"e":"Vinte e dois anos depois da abolição, oficiais ainda chicoteavam marinheiros. A revolta venceu, mas seus líderes foram perseguidos. João Cândido ficou conhecido como o Almirante Negro."},{"t":12,"y":"1917","q":"A greve geral de 1917 em São Paulo começou em fábricas têxteis. Quem eram muitos dos grevistas iniciais?","o":["Operárias, muitas delas imigrantes","Fazendeiros de café do interior","Militares de baixa patente do Exército","Banqueiros e comerciantes paulistas"],"e":"A morte do sapateiro anarquista José Martinez pela polícia fez a greve se espalhar. Dezenas de milhares pararam a cidade."},{"t":12,"y":"1922","q":"Os Dezoito do Forte e a Coluna Prestes fizeram parte de qual movimento?","o":["Tenent
