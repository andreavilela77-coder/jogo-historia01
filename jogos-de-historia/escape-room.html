<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Escape do Arquivo Histórico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a dark archive room. Six locked drawers in a grid; each opens a paper "document" with the puzzle.
   Single dark look on purpose (archive at night), readable on a projector and on phones. */
:root{
  --room:#11151D; --wall:#1A202C; --drawer:#232B3A; --line:#384357;
  --paper:#F1E9D8; --paper-ink:#2A2418; --paper-line:#D8CCB3;
  --brass:#E3B04B; --brass-ink:#1A1408; --ink:#EEF0F4; --muted:#A9B2C3;
  --ok:#4CC38A; --ok-paper:#2E7D55; --bad:#FF7A6B; --bad-paper:#B23A2C;
  --type:"Special Elite","Courier New",monospace;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--room)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px;
  background:radial-gradient(900px 500px at 50% 0%, #222A3A, var(--room)) fixed}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.type{font-family:var(--type)}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:700;background:var(--brass);color:var(--brass-ink);font-size:1.05rem}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}

/* start */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-family:var(--type);font-size:clamp(2.4rem,6vw,4.2rem);font-weight:400;color:var(--brass)}
.hero p{color:var(--muted);margin:0;max-width:56ch}
.series{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.serie{background:var(--drawer);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.serie b{font-family:var(--type);font-size:1.6rem;font-weight:400;color:var(--brass)}
.serie span{color:var(--muted);font-size:.92rem}
.serie[aria-pressed="true"]{border-color:var(--brass);background:#2B2A26}
.opts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select{background:var(--drawer);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);font:inherit}
.letter-card{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:22px 24px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-1.2deg);display:flex;flex-direction:column;gap:10px;font-family:var(--type)}
.letter-card p{margin:0;line-height:1.55}
.saved{background:#1E2A24;border:1px solid var(--ok);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.saved p{margin:0;flex:1;min-width:220px}

/* game */
.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hud h2{font-family:var(--type);font-weight:400;font-size:1.5rem;color:var(--brass);flex:1;min-width:200px}
.chip{background:var(--drawer);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.timer{font-family:var(--type);font-size:1.3rem;color:var(--brass)}
.chip.timer.low{color:var(--bad);border-color:var(--bad)}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{width:48px;height:56px;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--type);font-size:1.8rem;color:var(--brass);background:var(--wall)}
.slot.on{border-style:solid;border-color:var(--brass);background:#2B2A26}
.drawers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.drawer{background:linear-gradient(180deg,var(--drawer),#1D2431);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px;position:relative}
.drawer:hover{border-color:var(--brass)}
.drawer .n{font-family:var(--type);color:var(--brass);font-size:1.1rem}
.drawer h3{font-size:1.15rem}
.drawer .kind{color:var(--muted);font-size:.88rem}
.drawer .lock{position:absolute;right:14px;top:12px;font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.drawer.done{border-color:var(--ok);background:linear-gradient(180deg,#1E2E27,#1A2620)}
.drawer.done .lock{color:var(--ok)}
.drawer .got{font-family:var(--type);font-size:1.4rem;color:var(--brass)}
.final{background:#2B2A26;border:2px solid var(--brass);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.final h3{font-family:var(--type);font-weight:400;color:var(--brass);font-size:1.5rem}

/* puzzle overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.88);overflow:auto;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.doc{max-width:860px;margin:0 auto;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:16px;
  background-image:repeating-linear-gradient(0deg, transparent 0 31px, rgba(150,130,90,.12) 31px 32px)}
.doc .top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.doc h3{font-family:var(--type);font-weight:400;font-size:1.6rem}
.doc .prompt{font-size:1.2rem;margin:0;line-height:1.5}
.doc .stamp{font-family:var(--type);color:var(--bad-paper);border:2px solid var(--bad-paper);padding:2px 10px;transform:rotate(-4deg);font-size:.95rem}
.pbtn{background:#FBF7EE;border:2px solid var(--paper-line);border-radius:10px;padding:12px 14px;text-align:left;color:var(--paper-ink);font-size:1.05rem}
.pbtn:hover:not(:disabled){border-color:var(--paper-ink)}
.pbtn[aria-pressed="true"]{border-color:var(--paper-ink);background:#E9DFC6;font-weight:700}
.pbtn.ok{border-color:var(--ok-paper);background:#DCEFE3;color:#163B28}
.pbtn.no{border-color:var(--bad-paper);background:#F5D9D3}
.pbtn:disabled{cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.codein{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.codein input{width:11ch;font-family:var(--type);font-size:2rem;letter-spacing:.3em;text-align:center;background:#FBF7EE;color:var(--paper-ink);border:2px solid var(--paper-ink);border-radius:10px;padding:8px}
.wordin input{width:min(100%,340px);font-family:var(--type);font-size:1.6rem;letter-spacing:.12em;text-transform:uppercase;background:#FBF7EE;color:var(--paper-ink);border:2px solid var(--paper-ink);border-radius:10px;padding:8px 12px}
.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:2px dashed var(--paper-line);border-radius:10px;align-items:center}
.seq span,.seq button{border-radius:8px;padding:8px 12px;font-size:1rem;text-align:left}
.seq .slotlock{background:#DCEFE3;color:#163B28;border:2px solid var(--ok-paper);font-weight:700}
.seq .slotlock b{color:var(--ok-paper);margin-left:6px;white-space:nowrap}
.seq .slotfill{background:var(--paper-ink);color:var(--paper);border:2px solid var(--paper-ink)}
.seq .slotfill small{opacity:.7;font-weight:400}
.seq .slotempty{border:2px dashed var(--paper-line);color:#8A7C60}
.sortrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--paper-line);padding-block:6px}
.sortrow span{min-width:0}
.mcq{display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--paper-line);padding-bottom:12px}
.mcq p{margin:0;font-weight:700}
.msg{border-radius:10px;padding:12px 14px;margin:0;font-weight:700}
.msg.no{background:#F5D9D3;color:#6E1F15}
.msg.ok{background:#DCEFE3;color:#163B28}
.msg.hint{background:#EFE3C2;color:#4A3A12}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dbtn{border:0;border-radius:10px;padding:12px 22px;font-weight:700;background:var(--paper-ink);color:var(--paper);font-size:1.05rem}
.dbtn.sec{background:transparent;color:var(--paper-ink);border:2px solid var(--paper-ink)}
.dbtn:disabled{opacity:.4;cursor:default}
.solved{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.biglet{font-family:var(--type);font-size:4rem;line-height:1;background:var(--paper-ink);color:var(--brass);border-radius:12px;padding:10px 26px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* win */
.win{max-width:760px;margin:30px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.win h1{font-family:var(--type);font-weight:400;font-size:clamp(2.4rem,7vw,4.4rem);color:var(--brass)}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--drawer);border:1px solid var(--line);border-radius:14px;padding:14px 22px;min-width:150px}
.stat b{display:block;font-family:var(--type);font-size:2rem;color:var(--brass);font-weight:400}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
footer{color:var(--muted);font-size:.85rem}

@media (min-width:1200px){ body{font-size:20px} .doc{max-width:1000px} .doc .prompt{font-size:1.3rem} .pbtn{font-size:1.15rem} }
@media (max-width:820px){ .hero{grid-template-columns:1fr} .drawers{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .drawers,.series,.grid2{grid-template-columns:1fr} .doc{padding:18px} body{font-size:16px} .sortrow{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ .shake{animation:none} }
</style>

<div class="wrap" id="app"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
const ROOMS = {
 1: {
  title: "O Museu das Civilizações", word: "SENADO",
  story: "A turma ficou trancada no Museu das Civilizações depois do horário de visita. Seis gavetas do acervo guardam pistas da Antiguidade ao Brasil colonial. Cada gaveta aberta revela uma letra. Com as seis letras, vocês descobrem a senha da saída.",
  riddle: "Na República Romana, o conselho dos patrícios que controlava a política.",
  locks: [
   {title:"O cofre das fronteiras", type:"code", letter:"D", answer:"1750",
    prompt:"O cofre tem 4 dígitos: o ano do Tratado de Madri, que adotou o princípio do uti possidetis.",
    hint:"É em meados do século XVIII, mesmo século do ouro de Minas.",
    fact:"Com o uti possidetis, ficava com a terra quem a ocupava de fato. O mapa do Brasil ficou parecido com o atual."},
   {title:"A galeria dos impérios", type:"order", letter:"O",
    prompt:"As placas da galeria se misturaram. Toquem nelas na ordem cronológica, da mais antiga para a mais recente.",
    items:["Guerras Médicas entre gregos e persas","Conquistas de Alexandre, o Grande","Guerras Púnicas entre Roma e Cartago","Édito de Milão dá liberdade aos cristãos","Mansa Musa, do Mali, vai a Meca","Gutenberg cria a prensa de tipos móveis"],

    fact:"Do século V a.C. ao século XV: Grécia, Roma, o Mali medieval e a imprensa que abriu caminho para a Reforma."},
   {title:"O glossário do museu", type:"match", letter:"S",
    prompt:"Liguem cada palavra ao seu significado. Toquem numa palavra e depois na definição.",
    pairs:[["Encomienda","Direito de um colono espanhol de explorar o trabalho indígena"],["Homens bons","Proprietários que votavam nas câmaras municipais da colônia"],["Derrama","Cobrança forçada dos impostos atrasados sobre o ouro"],["Banalidades","Taxas pelo uso do moinho e do forno do senhor feudal"]],
    hint:"A derrama foi o estopim da Inconfidência Mineira. As banalidades são do feudalismo.",
    fact:"Da Europa feudal às Américas, essas palavras mostram como o trabalho e os impostos eram controlados pelos poderosos."},
   {title:"O guia do museu", type:"mc", letter:"A",
    prompt:"Respondam às três perguntas. A gaveta só abre se as três estiverem certas.",
    qs:[
     {q:"Quem escreveu o Leviatã e disse que “o homem é o lobo do homem”?",o:["Thomas Hobbes","John Locke","Montesquieu","Jean-Jacques Rousseau"]},
     {q:"Na Inglaterra industrial, como os luditas protestavam?",o:["Quebrando máquinas","Votando no Parlamento","Fundando bancos","Criando escolas"]},
     {q:"Onde foi encontrada Luzia, um dos esqueletos mais antigos das Américas?",o:["Lagoa Santa, Minas Gerais","Ilha de Marajó, Pará","Vale do Ribeira, São Paulo","Chapada Diamantina, Bahia"]}
    ],
    hint:"Locke defendia o direito de resistir ao governo. Luzia foi achada em Minas Gerais.",
    fact:"Hobbes defendia um soberano absoluto para escapar da “guerra de todos contra todos”."},
   {title:"A etiqueta apagada", type:"word", letter:"E", answers:["MALES","MALÊS","REVOLTA DOS MALES"],
    prompt:"A etiqueta de uma gaveta está apagada: em 1835, africanos muçulmanos, muitos alfabetizados em árabe, se rebelaram em Salvador. Completem: Revolta dos ______.",

    fact:"“Malê” vem de imale, palavra iorubá para muçulmano. A revolta assustou as elites escravistas do país inteiro."},
   {title:"Mercantilismo ou liberalismo?", type:"sort", letter:"N", bins:["Mercantilismo","Liberalismo"],
    prompt:"As fichas de duas ideias econômicas se misturaram. Separem cada uma na ideia certa.",
    items:[["Acúmulo de metais preciosos",0],["Balança comercial favorável",0],["Pacto colonial com a metrópole",0],["Mão invisível do mercado",1],["Livre concorrência",1],["Divisão do trabalho de Adam Smith",1]],
    hint:"Três fichas são de cada ideia.",
    fact:"O mercantilismo media a riqueza em metais; Adam Smith via a riqueza no trabalho e na troca livre."}
  ]
 },
 2: {
  title: "A Redação Clandestina", word: "VARGAS",
  story: "Vocês trabalham num jornal operário proibido e a polícia trancou a redação. Seis gavetas escondem notícias do século XIX e do início do século XX. Cada gaveta aberta revela uma letra. Com as seis letras, vocês descobrem a senha da porta dos fundos.",
  riddle: "Presidente que criou a CLT em 1943 e comandou o Estado Novo: Getúlio ______.",
  locks: [
   {title:"O cofre da República", type:"code", letter:"G", answer:"1889",
    prompt:"O cofre tem 4 dígitos: o ano da Proclamação da República no Brasil.",
    hint:"Foi um ano depois da Lei Áurea.",
    fact:"Aristides Lobo escreveu que o povo assistiu à Proclamação “bestializado”, sem entender o que acontecia."},
   {title:"As manchetes fora de ordem", type:"order", letter:"A",
    prompt:"As manchetes caíram no chão. Toquem nelas na ordem cronológica, da mais antiga para a mais recente.",

    fact:"1798, 1820, 1824, 1840, 1850 e 1896: da crise colonial ao começo da República."},
   {title:"O dicionário da redação", type:"match", letter:"S",
    prompt:"Liguem cada termo ao seu significado. Toquem num termo e depois na definição.",

    fact:"Quatro palavras que ajudam a entender a Primeira República e os anos 1930."},
   {title:"A entrevista", type:"mc", letter:"V",
    prompt:"Respondam às três perguntas. A gaveta só abre se as três estiverem certas.",
    qs:[
     {q:"Garibaldi e seus “camisas vermelhas” lutaram pela unificação da...",o:["Itália","Alemanha","Espanha","Polônia"]},
     {q:"Quem escreveu a Declaração dos Direitos da Mulher e da Cidadã, em 1791?",o:["Olympe de Gouges","Rosa Luxemburgo","Maria Quitéria de Jesus","Joana d’Arc"]},
     {q:"A greve de Chicago de 1886, no episódio de Haymarket, deu origem a qual data?",o:["1º de maio","8 de março","14 de julho","7 de setembro"]}

    hint:"Bismarck unificou a Alemanha. O 14 de julho lembra a Bastilha.",
    fact:"O 1º de maio, Dia do Trabalhador, lembra a luta pela jornada de 8 horas."},
   {title:"O título censurado", type:"word", letter:"R", answers:["TENENTISMO"],
    prompt:"O censor riscou o título: os Dezoito do Forte, em 1922, e a Coluna Prestes fizeram parte de qual movimento?",
    hint:"Vem do posto de jovens oficiais do Exército. Tem 10 letras e termina em “ismo”.",
    fact:"Os tenentes criticavam as oligarquias e defendiam o voto secreto. A Coluna Prestes percorreu cerca de 25 mil km pelo interior."},
   {title:"Anarquistas ou marxistas?", type:"sort", letter:"A", bins:["Anarquistas","Marxistas"],
    prompt:"Os panfletos de dois grupos se misturaram. Separem cada um no grupo certo.",
    items:[["Fim imediato do Estado",0],["Mikhail Bakunin",0],["Pierre-Joseph Proudhon",0],["Estado operário como transição",1],["Manifesto Comunista",1],["Luta de classes como motor da história",1]],
    hint:"Três panfletos são de cada grupo. O Manifesto Comunista é de Marx e Engels.",
    fact:"Essa divergência rachou a Associação Internacional dos Trabalhadores no século XIX."}

 },
 3: {
  title: "A Rádio da Resistência", word: "GANDHI",
  story: "Vocês fazem parte de uma rádio clandestina, e o estúdio foi lacrado. Seis gavetas do estúdio guardam fitas com notícias do século XX. Cada gaveta aberta revela uma letra. Com as seis letras, vocês descobrem a senha para colocar a rádio de volta no ar.",
  riddle: "Líder da independência da Índia, que usou a resistência não violenta.",
  locks: [
   {title:"O cofre do fim de uma era", type:"code", letter:"H", answer:"1991",

    hint:"O AI-5 é de 1968. Os caras-pintadas foram às ruas em 1992.",
    fact:"Da ditadura à Nova República: quatro momentos da história recente do Brasil."},
   {title:"O programa de perguntas", type:"mc", letter:"G",
    prompt:"Respondam às três perguntas. A gaveta só abre se as três estiverem certas.",
    qs:[

     {q:"Em 1962, o mundo quase teve uma guerra nuclear por causa de...",o:["Mísseis soviéticos em Cuba","A queda do Muro de Berlim","A guerra no Vietnã","A crise mundial do preço do petróleo"]}

for (const s of [1,2,3]) ROOMS[s].locks.forEach((L,i)=>{ const base={type:L.type,prompt:L.prompt,hint:L.hint}; ["answer","answers","items","pairs","qs","bins"].forEach(k=>{ if(L[k]!==undefined) base[k]=L[k]; }); L.stages=[base, ...EXTRA[s][i]]; });

const KIND = {code:"Cadeado de números", order:"Linha do tempo", match:"Ligar pares", mc:"Três perguntas", word:"Palavra secreta", sort:"Separar em grupos"};
const kindOf = st => st.type==="mc" && st.qs.length===1 ? "Pergunta rápida" : st.type==="sort" && st.bins[0]==="Verdadeiro" ? "Verdadeiro ou falso" : KIND[st.type];
const NST = 3;
const LS = "escape-historia-v3";
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim();
const fmt = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };

let G = null, tick = null, pz = null, choice = { serie:1, minutes:50 };
function save(){ try{ const all=JSON.parse(localStorage.getItem(LS)||"{}"); all[G.serie]=G; localStorage.setItem(LS,JSON.stringify(all)); }catch(e){} }
function loadAll(){ try{ return JSON.parse(localStorage.getItem(LS)||"{}"); }catch(e){ return {}; } }
function clearSaved(s){ try{ const all=loadAll(); delete all[s]; localStorage.setItem(LS,JSON.stringify(all)); }catch(e){} }

/* ---------- start ---------- */

/* ---------- room ---------- */
function remaining(){ return G.limit ? G.limit - G.elapsed - G.penalty : null; }
function startTick(){ stopTick(); tick=setInterval(()=>{ G.elapsed++; if(G.elapsed%5===0) save(); updHud(); },1000); }
function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }
function updHud(){
  const t=document.getElementById("timer"); if(!t) return;
  if(G.limit){ const r=remaining(); t.textContent=fmt(r); t.classList.toggle("low", r<=300);
    if(r<=0 && !G.overtime){ G.overtime=true; save(); timeUp(); } }
  else t.textContent = fmt(G.elapsed+G.penalty);
}
function renderRoom(){
  const R=ROOMS[G.serie], all=G.done.every(Boolean);
  app.innerHTML = `
  <div class="hud">
    <h2>${esc(R.title)} · ${G.serie}ª série</h2>

      ${G.done[i]?`<span class="got">Letra ${l.letter}</span>`:""}
    </button>`).join("")}</div>
  ${all?`<div class="final" id="final">
    <h3>A porta final</h3>
    <p style="margin:0">Organizem as seis letras para formar a senha. Pista: ${esc(R.riddle)}</p>
    <div class="slots">${R.locks.map(l=>`<div class="slot on">${l.letter}</div>`).join("")}</div>
    <form class="opts" id="fform"><input id="fword" autocomplete="off" aria-label="Senha final" style="font-family:var(--type);font-size:1.5rem;letter-spacing:.15em;text-transform:uppercase;background:var(--wall);border:2px solid var(--brass);border-radius:10px;padding:8px 12px;color:var(--ink);width:min(100%,280px)"><button class="btn">Abrir a porta</button></form>
    <p id="fmsg" style="margin:0" aria-live="polite"></p>
  </div>`:`<p style="color:var(--muted);margin:0">Abram as gavetas em qualquer ordem. Em grupo, vocês podem dividir as tarefas.</p>`}`;
  app.querySelectorAll(".drawer").forEach(b=>b.onclick=()=>openLock(+b.dataset.i));
  document.getElementById("exit").onclick=()=>{ save(); stopTick(); choice.serie=G.serie; renderStart(); };
  const ff=document.getElementById("fform");
  if(ff) ff.onsubmit=e=>{ e.preventDefault(); const v=norm(document.getElementById("fword").value);
    if(v===R.word){ win(); } else { penalize(); const m=document.getElementById("fmsg"); m.textContent="Senha errada. Menos 30 segundos. Releiam a pista."; m.style.color="var(--bad)"; ff.classList.remove("shake"); void ff.offsetWidth; ff.classList.add("shake"); } };
  updHud(); if(!tick) startTick();
}
function penalize(){ G.penalty+=30; G.errors++; save(); updHud(); }
function timeUp(){
  const ov=document.createElement("div"); ov.className="ov"; ov.id="tu";
  ov.innerHTML=`<div class="doc" style="max-width:560px;text-align:center;align-items:center"><h3>O tempo acabou!</h3><p class="prompt">A sala não tranca de vez: vocês podem continuar até abrir a porta, mas a partida fica marcada como fora do tempo.</p><div class="acts"><button class="dbtn" id="cont">Continuar</button></div></div>`;
  document.body.appendChild(ov); document.getElementById("cont").onclick=()=>ov.remove();
}

/* ---------- puzzles ---------- */
function openLock(i){
  const lock=ROOMS[G.serie].locks[i], s=Math.min(G.stage[i],NST-1);
  const L={...lock.stages[s], title:lock.title};
  pz={i, s, lock, L, state:{}};
  const ov=document.createElement("div"); ov.className="ov"; ov.id="ov";
  ov.innerHTML=`<div class="doc" id="doc">
    <div class="top"><span class="eyebrow" style="color:#6B5C3E" id="dkind">Gaveta ${i+1} · ${G.done[i]?"concluída":`Desafio ${s+1} de 3 · ${kindOf(L)}`}</span>${G.done[i]?`<span class="stamp" style="color:var(--ok-paper);border-color:var(--ok-paper)">Aberta</span>`:`<span class="stamp">Trancada</span>`}</div>
    <h3>${esc(L.title)}</h3>
    <p class="prompt" id="dprompt">${G.done[i]?"":esc(L.prompt)}</p>
    <div id="body"></div>
    <div id="msg" aria-live="polite"></div>
    <div class="acts" id="acts"></div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov) closeLock(); });
  if(G.done[i]) showSolved(true); else renderPuzzle();
}
function closeLock(){ const o=document.getElementById("ov"); if(o) o.remove(); pz=null; renderRoom(); }
function acts(html){ document.getElementById("acts").innerHTML = html; }
function msg(cls, text){ document.getElementById("msg").innerHTML = text ? `<p class="msg ${cls}">${text}</p>` : ""; }
function wrong(text){
  penalize(); msg("no", esc(text)+" Menos 30 segundos.");
  const d=document.getElementById("doc"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
}
function commonActs(checkLabel){
  const hk=pz.i+"-"+pz.s, used=G.hintsUsed[hk];
  acts(`<button class="dbtn sec" id="hint" ${(!used && G.hintsLeft<=0)?"disabled":""}>${used?"Ver dica de novo":"Usar dica (−2 min)"}</button>
        <button class="dbtn sec" id="close">Fechar</button>
        ${checkLabel?`<button class="dbtn" id="check">${checkLabel}</button>`:""}`);
  document.getElementById("close").onclick=closeLock;
  document.getElementById("hint").onclick=()=>{
    if(!G.hintsUsed[hk]){ if(G.hintsLeft<=0) return; G.hintsLeft--; G.hintsUsed[hk]=1; G.penalty+=120; save(); updHud(); }
    msg("hint","Dica: "+esc(pz.L.hint)); document.getElementById("hint").textContent="Ver dica de novo";
  };
}
function renderPuzzle(){
  const L=pz.L, b=document.getElementById("body");
  if(L.type==="code"){
    b.innerHTML=`<form class="codein" id="cf"><input id="code" inputmode="numeric" maxlength="${L.answer.length}" aria-label="Código de ${L.answer.length} dígitos" autocomplete="off" placeholder="${"•".repeat(L.answer.length)}"></form>`;
    commonActs("Abrir o cofre");
    const go=()=>{ const v=document.getElementById("code").value.replace(/\D/g,""); if(v===L.answer) solve(); else wrong("O cofre não abriu."); };
    document.getElementById("cf").onsubmit=e=>{e.preventDefault();go();}; document.getElementById("check").onclick=go;
    document.getElementById("code").focus({preventScroll:true});
  }
  if(L.type==="word"){
    b.innerHTML=`<form class="wordin" id="wf"><input id="word" autocomplete="off" aria-label="Resposta"></form>`;
    commonActs("Conferir");
    const go=()=>{ const v=norm(document.getElementById("word").value); if(L.answers.some(a=>norm(a)===v)) solve(); else wrong("Não é esse nome."); };
    document.getElementById("wf").onsubmit=e=>{e.preventDefault();go();}; document.getElementById("check").onclick=go;
    document.getElementById("word").focus({preventScroll:true});
  }
  if(L.type==="order"){
    // slots[n] = item placed at position n; locked positions stay after a check
    const st=pz.state, N=L.items.length; st.slots=Array(N).fill(null); st.locked=Array(N).fill(false); st.items=shuffle(L.items.map((t,k)=>({t,k})));
    const placed = k => st.slots.includes(k);
    const draw=()=>{
      const any = st.slots.some(x=>x!==null);
      b.innerHTML=`<div class="seq" aria-label="Sua ordem" style="flex-direction:column;align-items:stretch">${st.slots.map((k,n)=>
          st.locked[n] ? `<span class="slotlock">${n+1}. ${esc(L.items[k])} <b aria-label="no lugar certo">✓ no lugar certo</b></span>`
          : k!==null ? `<button class="slotfill" data-n="${n}" title="Tocar para tirar daqui">${n+1}. ${esc(L.items[k])} <small>(tocar para tirar)</small></button>`
          : `<span class="slotempty">${n+1}. ______</span>`).join("")}
        ${any?"":`<em style="opacity:.7">Toquem nas fichas abaixo, da mais antiga para a mais recente.</em>`}</div>
      <div class="col" style="margin-top:12px">${st.items.filter(it=>!st.slots.some((k,n)=>k===it.k&&st.locked[n])).map(it=>`<button class="pbtn" data-k="${it.k}" ${placed(it.k)?"disabled":""} style="${placed(it.k)?"opacity:.35":""}">${esc(it.t)}</button>`).join("")}</div>`;
      b.querySelectorAll(".pbtn").forEach(x=>x.onclick=()=>{ const free=st.slots.indexOf(null); if(free<0) return; st.slots[free]=+x.dataset.k; draw(); });
      b.querySelectorAll(".slotfill").forEach(x=>x.onclick=()=>{ st.slots[+x.dataset.n]=null; draw(); });
    };
    draw(); commonActs("Conferir a ordem");
    const a=document.getElementById("acts"); const clr=document.createElement("button"); clr.className="dbtn sec"; clr.textContent="Limpar as não confirmadas"; clr.onclick=()=>{ st.slots=st.slots.map((k,n)=>st.locked[n]?k:null); msg(); draw(); }; a.insertBefore(clr,a.firstChild);
    document.getElementById("check").onclick=()=>{
      if(st.slots.includes(null)){ msg("hint","Coloquem todas as fichas antes de conferir."); return; }
      st.slots.forEach((k,n)=>{ if(k===n) st.locked[n]=true; });
      const right=st.locked.filter(Boolean).length;
      if(right===N) solve();
      else { st.slots=st.slots.map((k,n)=>st.locked[n]?k:null); wrong(`${right} de ${N} fichas estão no lugar certo e ficaram travadas em verde. Reorganizem só as outras.`); draw(); }
    };
  }
  if(L.type==="match"){
    const st=pz.state; st.left=shuffle(L.pairs.map((p,k)=>k)); st.right=shuffle(L.pairs.map((p,k)=>k)); st.sel=null; st.ok=[];
    const draw=()=>{
      b.innerHTML=`<div class="grid2"><div class="col">${st.left.map(k=>`<button class="pbtn ${st.ok.includes(k)?"ok":""}" data-l="${k}" aria-pressed="${st.sel===k}" ${st.ok.includes(k)?"disabled":""}><b>${esc(L.pairs[k][0])}</b></button>`).join("")}</div>
        <div class="col">${st.right.map(k=>`<button class="pbtn ${st.ok.includes(k)?"ok":""}" data-r="${k}" ${st.ok.includes(k)?"disabled":""}>${esc(L.pairs[k][1])}</button>`).join("")}</div></div>`;
      b.querySelectorAll("[data-l]").forEach(x=>x.onclick=()=>{ st.sel=+x.dataset.l; draw(); });
      b.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{
        if(st.sel===null){ msg("hint","Primeiro toquem numa palavra da coluna da esquerda."); return; }
        const r=+x.dataset.r;
        if(r===st.sel){ st.ok.push(r); st.sel=null; msg(); draw(); if(st.ok.length===L.pairs.length) solve(); }
        else { st.sel=null; draw(); wrong("Esse par não combina."); }
      });
    };
    draw(); commonActs(null);
  }
  if(L.type==="mc"){
    const st=pz.state; st.ans=L.qs.map(()=>null); st.opts=L.qs.map(q=>shuffle(q.o.map((t,k)=>({t,k}))));
    const draw=()=>{
      b.innerHTML=L.qs.map((q,n)=>`<div class="mcq"><p>${n+1}. ${esc(q.q)}</p><div class="grid2">${st.opts[n].map(o=>`<button class="pbtn" data-q="${n}" data-k="${o.k}" aria-pressed="${st.ans[n]===o.k}">${esc(o.t)}</button>`).join("")}</div></div>`).join("");
      b.querySelectorAll(".pbtn").forEach(x=>x.onclick=()=>{ st.ans[+x.dataset.q]=+x.dataset.k; draw(); });
    };
    draw(); commonActs("Conferir as respostas");
    document.getElementById("check").onclick=()=>{
      if(st.ans.some(a=>a===null)){ msg("hint",L.qs.length===1?"Escolham uma alternativa antes de conferir.":"Respondam a todas as perguntas antes de conferir."); return; }
      const right=st.ans.filter(a=>a===0).length;
      if(right===L.qs.length) solve(); else wrong(L.qs.length===1?"Resposta errada.":`${right} de ${L.qs.length} respostas estão certas. Descubram qual está errada.`);
    };
  }
  if(L.type==="sort"){
    const st=pz.state; st.items=shuffle(L.items.map((it,k)=>k)); st.ans={};
    const draw=()=>{
      b.innerHTML=`<div class="col">${st.items.map(k=>`<div class="sortrow"><span>${esc(L.items[k][0])}</span>${L.bins.map((bn,j)=>`<button class="pbtn" data-k="${k}" data-b="${j}" aria-pressed="${st.ans[k]===j}" style="padding:8px 12px">${esc(bn)}</button>`).join("")}</div>`).join("")}</div>`;
      b.querySelectorAll(".pbtn").forEach(x=>x.onclick=()=>{ st.ans[+x.dataset.k]=+x.dataset.b; draw(); });
    };
    draw(); commonActs("Conferir");
    document.getElementById("check").onclick=()=>{
      if(Object.keys(st.ans).length<L.items.length){ msg("hint","Classifiquem todas as fichas antes de conferir."); return; }
      const right=L.items.filter((it,k)=>st.ans[k]===it[1]).length;
      if(right===L.items.length) solve(); else wrong(`${right} de ${L.items.length} fichas estão no grupo certo.`);
    };
  }
}
function solve(){
  if(pz.s < NST-1){
    G.stage[pz.i]=pz.s+1; save(); confetti(false);
    const left=NST-1-pz.s;
    document.getElementById("body").innerHTML=`<div class="solved"><span class="biglet" style="font-size:2.4rem" aria-label="Desafio ${pz.s+1} concluído">${pz.s+1}/3</span>
      <div style="flex:1;min-width:220px"><p style="margin:0;font-family:var(--type);font-size:1.3rem">Desafio ${pz.s+1} concluído! ${left===1?"Falta só mais um":"Faltam mais "+left} para a gaveta abrir.</p></div></div>`;
    msg(); acts(`<button class="dbtn sec" id="close2">Fechar</button><button class="dbtn" id="nextst">Próximo desafio</button>`);
    document.getElementById("close2").onclick=closeLock;
    document.getElementById("nextst").onclick=()=>{
      pz.s++; pz.L={...pz.lock.stages[pz.s], title:pz.lock.title}; pz.state={};
      document.getElementById("dkind").textContent=`Gaveta ${pz.i+1} · Desafio ${pz.s+1} de 3 · ${kindOf(pz.L)}`;
      document.getElementById("dprompt").textContent=pz.L.prompt; msg(); renderPuzzle();
    };
    document.getElementById("nextst").focus({preventScroll:true});
    return;
  }
  G.stage[pz.i]=NST; G.done[pz.i]=1; save(); updHud(); confetti(false); showSolved(false);
}
function showSolved(already){
  const L=pz.lock;
  document.getElementById("body").innerHTML=`<div class="solved"><span class="biglet" aria-label="Letra ${L.letter}">${L.letter}</span>
    <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px"><p style="margin:0;font-family:var(--type);font-size:1.3rem">${already?"Esta gaveta já está aberta.":"Três desafios vencidos: a gaveta abriu! Vocês encontraram uma letra."}</p><p style="margin:0"><b>Você sabia?</b> ${esc(L.fact)}</p></div></div>`;
  msg();
  const left=G.done.filter(x=>!x).length;
  acts(`<button class="dbtn" id="back">${left?"Voltar às gavetas":"Ir para a porta final"}</button>`);
  document.getElementById("back").onclick=closeLock;
  const st=document.querySelector("#doc .stamp"); if(st){ st.textContent="Aberta"; st.style.color="var(--ok-paper)"; st.style.borderColor="var(--ok-paper)"; }
}

/* ---------- win ---------- */
function win(){
  stopTick(); G.won=true; save();
  const used=G.elapsed+G.penalty, R=ROOMS[G.serie];
  const intime = !G.limit || used<=G.limit;
  app.innerHTML=`<div class="win">
    <div class="eyebrow">${G.serie}ª série · ${esc(R.title)}</div>
    <h1>Vocês escaparam!</h1>
    <p style="margin:0;font-size:1.2rem">A senha era <b class="type" style="color:var(--brass);font-size:1.5rem">${esc(R.word)}</b>. ${intime?"E deu tempo!":"Passou do tempo, mas a porta abriu."}</p>
    <div class="stats">
      <div class="stat"><b>${fmt(used)}</b>tempo total</div>
      <div class="stat"><b>${G.errors}</b>${G.errors===1?"erro":"erros"}</div>
      <div class="stat"><b>${5-G.hintsLeft}</b>${5-G.hintsLeft===1?"dica usada":"dicas usadas"}</div>
    </div>
    <p style="color:var(--muted);margin:0">O tempo total já inclui as penalidades de erros e dicas.</p>
    <div class="opts" style="justify-content:center"><button class="btn" id="again">Jogar outra sala</button></div>
  </div>`;
  confetti(true);
  document.getElementById("again").onclick=()=>{ clearSaved(G.serie); choice.serie=G.serie; G=null; renderStart(); };
}

/* ---------- confetti ---------- */
function confetti(big){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("confetti"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#E3B04B","#F1E9D8","#4CC38A","#FF7A6B","#8FB3FF"];
  const ps=Array.from({length:big?200:80},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:6+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  const t0=performance.now();
  (function f(t){ ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.vy+=.45; p.x+=p.vx; p.y+=p.vy; p.r+=.2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t-t0<(big?3000:1400)) requestAnimationFrame(f); else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(document.getElementById("tu")) document.getElementById("tu").remove(); else if(pz) closeLock(); } });
const h=(location.hash||"").match(/serie-([123])/); if(h) choice.serie=+h[1];
renderStart();
</script>
